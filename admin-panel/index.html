          var wb = VERDICT_WEIGHT[b.verdict] != null ? VERDICT_WEIGHT[b.verdict] : 2;
          if (wa !== wb) return wa - wb;
          return new Date(a.createdAt) - new Date(b.createdAt); // oldest first within a bucket
        });
        body = h("div", null, items.map(VerificationCard));
      }
      return h("div", null,
        v.notice ? h("div", { class: "flash flash-info", style: "margin-bottom:12px" }, v.notice) : null,
        h("div", { class: "row", style: "justify-content:space-between;margin-bottom:14px" },
          h("h2", { style: "margin:0;font-size:18px" }, "Verifications",
            v.items ? h("span", { class: "muted", style: "font-weight:500;font-size:14px" }, "  " + v.items.length) : null),
          h("button", { class: "btn btn-sm", onclick: loadVerifications }, "Refresh")),
        h("div", { class: "muted", style: "margin:-6px 0 14px;font-size:13px" },
          "Screenshot proof is tier-3 supporting evidence — your decision is the gate before it counts."),
        body);
    }

    function VerificationCard(it) {
      var dup = it.duplicateCount > 0
        ? h("span", { class: "pill pill-bad", title: "This exact image appears on " + it.duplicateCount + " other upload(s)" }, "DUP ×" + it.duplicateCount)
        : null;
      return h("div", { class: "card", style: "cursor:pointer", onclick: function () { openVerification(it.id); } },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", null,
            h("div", { class: "row", style: "gap:8px;align-items:center" },
              pill(KIND_LABEL[it.kind] || it.kind, "info"),
              it.verdict ? pill(it.verdict, VERDICT_PILL[it.verdict]) : pill("no read", "neutral"),
              it.confidence != null ? h("span", { class: "muted", style: "font-size:12.5px" }, it.confidence + "% conf") : null,
              dup),
            h("div", { style: "margin-top:6px;font-weight:600" }, it.campaignTitle || "—"),
            h("div", { class: "muted mono", style: "margin-top:2px;font-size:12px" }, "task " + it.taskId.slice(0, 8) + " · user " + it.userId.slice(0, 8) + " · " + fmtDate(it.uploadedAt))),
          h("div", { style: "text-align:right" },
            pill(it.status, SUB_STATUS_PILL[it.status] || "neutral"),
            h("div", { class: "muted", style: "margin-top:6px;font-size:12px" }, "cost " + costUsd(it.costMicroUsd)),
            h("button", { class: "btn btn-sm btn-primary", style: "margin-top:8px", onclick: function (e) { e.stopPropagation(); openVerification(it.id); } }, "Review →"))));
    }

    function diffTable(match) {
      if (!match || !match.length) return h("div", { class: "muted", style: "font-size:13px" }, "No extracted fields to compare.");
      var head = h("div", { class: "row", style: "font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 0 6px" },
        h("div", { style: "flex:0 0 92px" }, "Field"), h("div", { style: "flex:1" }, "Expected"), h("div", { style: "flex:1" }, "Extracted"), h("div", { style: "flex:0 0 84px;text-align:right" }, "Match"));
      var rows = match.map(function (f) {
        var kind = f.matched === true ? "ok" : f.matched === false ? "bad" : "neutral";
        var label = f.matched === true ? "match" : f.matched === false ? "mismatch" : "n/a";
        return h("div", { style: "border-top:1px solid var(--border);padding:8px 0" },
          h("div", { class: "row", style: "align-items:flex-start" },
            h("div", { style: "flex:0 0 92px;font-weight:600" }, FIELD_LABEL[f.field] || f.field),
            h("div", { style: "flex:1", class: "mono" }, f.expected == null ? "—" : String(f.expected)),
            h("div", { style: "flex:1", class: "mono" }, f.extracted == null ? "—" : String(f.extracted)),
            h("div", { style: "flex:0 0 84px;text-align:right" }, pill(label, kind))),
          f.note ? h("div", { class: "muted", style: "font-size:11.5px;margin-top:3px" }, f.note) : null);
      });
      return h("div", null, head, h("div", null, rows));
    }

    function VerificationDetail() {
      var v = state.verifications;
      var back = h("button", { class: "btn btn-sm btn-ghost", onclick: closeVerification }, "← Back to queue");
      if (v.detailLoading) return h("div", null, back, h("div", { class: "muted", style: "margin-top:14px" }, h("span", { class: "spin" }), " Loading…"));
      if (v.detailError) return h("div", null, back, h("div", { class: "flash flash-err", style: "margin-top:14px" }, v.detailError));
      var d = v.detail;
      if (!d) return h("div", null, back);

      // Left: the screenshot (private, streamed with auth; the view is audited).
      var imgBox;
      if (v.imgLoading) imgBox = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading image…");
      else if (v.imgUrl) imgBox = h("img", { src: v.imgUrl, alt: "verification screenshot", style: "max-width:100%;border-radius:8px;border:1px solid var(--border);display:block" });
      else imgBox = h("div", { class: "empty" }, "Image unavailable.");
      var dupNote = d.screenshot.duplicateCount > 0
        ? h("div", { class: "flash flash-err", style: "margin-top:10px;font-size:12.5px" }, "⚠ This exact image appears on " + d.screenshot.duplicateCount + " other upload(s) — possible reuse across users/tasks.")
        : null;
      var left = h("div", { class: "card" },
        h("h3", null, KIND_LABEL[d.kind] || d.kind, " screenshot"),
        imgBox,
        h("div", { class: "muted mono", style: "margin-top:8px;font-size:11px;word-break:break-all" }, "sha256 " + d.screenshot.sha256),
        h("div", { class: "muted", style: "font-size:12px;margin-top:2px" }, Math.round(d.screenshot.sizeBytes / 1024) + " KB · uploaded " + fmtDate(d.screenshot.uploadedAt) + " · viewing is audited"),
        dupNote);

      // Right: verdict + the expected-vs-extracted diff + task/campaign context.
      var meta = h("div", { class: "row", style: "gap:8px;align-items:center;flex-wrap:wrap" },
        d.verdict ? pill(d.verdict, VERDICT_PILL[d.verdict]) : pill("no read", "neutral"),
        pill(d.status, SUB_STATUS_PILL[d.status] || "neutral"),
        d.confidence != null ? h("span", { class: "muted", style: "font-size:12.5px" }, d.confidence + "% confidence") : null,
        h("span", { class: "muted", style: "font-size:12px" }, (d.model || "not extracted") + " · " + costUsd(d.costMicroUsd)));
      var errBox = d.status === "FAILED" && d.error ? h("div", { class: "flash flash-err", style: "margin-top:10px" }, "Extraction failed: " + d.error + " — review the raw screenshot.") : null;

      var context = h("div", { class: "grid-2", style: "margin-top:12px" },
        KV("Campaign", d.campaign.title),
        KV("Product", d.campaign.productName),
        KV("Expected price", rupees(d.campaign.productPricePaise)),
        KV("Min rating", d.campaign.minRating != null ? d.campaign.minRating + "★" : "—"),
        KV("Task state", d.task.state),
        KV("User", d.task.userId.slice(0, 8)));

      var right = h("div", { class: "card" },
        h("h3", null, "Do the details match?"),
        meta, errBox,
        h("div", { style: "margin-top:14px" }, diffTable(d.match)),
        h("div", { style: "margin-top:6px" }, context));

      return h("div", null, back,
        h("div", { class: "grid-2", style: "margin-top:14px;align-items:start" }, left, right),
        VerificationActions(d));
    }

    function VerificationActions(d) {
      var v = state.verifications;
      var decided = ["APPROVED", "REJECTED", "NEEDS_MORE"].indexOf(d.status) !== -1;
      if (decided) {
        return h("div", { class: "card" },
          h("div", { class: "muted" }, "Already ", h("b", null, d.status.toLowerCase()),
            d.reviewedAt ? " · " + fmtDate(d.reviewedAt) : "",
            d.reviewReason ? " · “" + d.reviewReason + "”" : ""));
      }
      var reason = h("textarea", { rows: "2", placeholder: "Reason / note (shown in the audit trail; recommended on reject or request-more)", style: "width:100%;resize:vertical" });
      // A reviewer-confirmed item price, ONLY for a PURCHASE — used when OCR
      // couldn't read the amount so we never assert the campaign price as fact.
      var priceField = null, priceInput = null;
      if (d.kind === "PURCHASE") {

        decideVerification(d.id, "approve", body, "Approved — evidence funnelled into the task.");
      }
      function reject() {
        var r = reason.value.trim();

      }
      function requestMore() {
        var r = reason.value.trim();

      }
      return h("div", { class: "card" },
        h("h3", null, "Decision"),
        h("div", { class: "muted", style: "font-size:12.5px;margin-bottom:8px" },
          "Approving funnels this as tier-3 ‘ocr’ evidence — the holding period, public-visibility re-check and FINANCE payout gate still apply."),
        reason, priceField,
        v.actionError ? h("div", { class: "flash flash-err", style: "margin-top:10px" }, v.actionError) : null,
        h("div", { class: "row", style: "margin-top:12px;gap:8px" },
          h("button", { class: "btn btn-primary", disabled: v.busy, onclick: approve }, v.busy ? "Working…" : "Approve"),
          h("button", { class: "btn", disabled: v.busy, onclick: requestMore }, "Request more"),
          h("button", { class: "btn btn-danger", disabled: v.busy, onclick: reject }, "Reject")));
    }

    function SearchScreen() {
      var input = h("input", { type: "text", placeholder: "Mobile number, e.g. 9876543210 or +919876543210", value: state.search.mobile || "" });
      function go(ev) { if (ev) ev.preventDefault(); if (input.value.trim()) doSearch(input.value); }
      var form = h("form", { onsubmit: go },
        h("label", { class: "field" }, h("span", null, "Find a user by mobile"),
          h("div", { class: "row" },
            h("div", { style: "flex:1;min-width:220px" }, input),
            h("button", { class: "btn btn-primary", type: "submit" }, "Search"))));

      var result = h("div");
      if (state.search.loading) result.appendChild(h("div", { class: "muted" }, h("span", { class: "spin" }), " Searching…"));

      else if (state.search.notFound) result.appendChild(h("div", { class: "empty" }, "No user found with mobile ", h("span", { class: "mono" }, state.search.mobile), "."));
      else if (state.search.result) result.appendChild(SummaryCard(state.search.result));

      return h("div", null, h("div", { class: "card" }, form), result);
    }

    function SummaryCard(u) {
      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between" },
          h("div", null,
            h("div", { class: "row" }, h("span", { class: "mono", style: "font-weight:700;font-size:16px" }, u.mobile), pill(u.status, USER_PILL[u.status])),
            h("div", { class: "muted mono", style: "margin-top:2px" }, u.displayId, "  ·  joined ", fmtDay(u.createdAt))),
          h("button", { class: "btn btn-primary", onclick: function () { loadUser(u.id, "search"); } }, "View full activity →")),
        h("div", { class: "grid-2", style: "margin-top:14px" },
          KV("Tickets", String(u.ticketBalance)),
          KV("Wallet", rupees(u.walletBalancePaise)),
          KV("Tasks", String(u.taskCount))));
    }
    function KV(k, v) { return h("div", { class: "kv" }, h("div", { class: "k" }, k), h("div", { class: "v num" }, v)); }

    /**
     * THE ORDER WINDOW WAS WIDENED FOR TESTING ON THIS TASK.
     *
     * Null on every real task. Shown in the "bad" tone because it is not a note,
     * it is a reason to look harder before paying: the date rule that normally
     * proves the campaign caused the purchase was handed a lower floor.
     *
     * Reads the number off the task and never recomputes it from a setting. The
     * setting can be turned off between the match and somebody looking at it, and
     * a mark that vanishes with it is not a mark.
     */
    function practiceMark(t) {
      var days = t && t.practiceWindowDays;
      if (typeof days !== "number" || !(days > 0)) return null;
      return pill("PRACTICE WINDOW " + String(days) + "d", "bad");
    }

    // ── the user page: begin ─────────────────────────────────────────────────
    //
    // ONE PERSON, READ IN FIVE SECONDS.
    //
    // Somebody is on the phone. Before their sentence is finished the agent needs
    // to know who they are speaking to, whether money is involved, and what is
    // happening with the offer they are ringing about.
    //
    // WHAT CHANGED, AND IT IS THE WHOLE POINT. Everything about one offer sits in
    // one card: its state, how far along it is, what it would pay, and its own
    // entries out of the trail. It used to be scattered — the offer in one list,
    // its claim and its screenshot somewhere down a chronological trail with
    // screens and chats in between — so "what happened with my kettle" meant
    // reassembling the offer by reading around it.
    //
    // WHAT IT STILL REFUSES TO DO. No message bodies, no question words, no
    // pictures. Those have their own audited routes, and why is written at the
    // top of the trail block above.
    //
    // AND NO CHART. One person does not produce a distribution, so a histogram of
    // one person's fortnight is a picture pretending to be analysis. Charts
    // belong on the screen that reads everybody.

    /**
     * THE SIX STEPS OF AN OFFER, IN ORDER, AS A PERSON SAYS THEM.
     *
     * The keys are the server's own task states — the whole TaskState enum, which
     * has exactly these six and nothing else. panel.test.mjs reads them out of
     * backend/src/tasks/engine/states.ts and fails if the two lists drift apart,
     * because a strip that quietly stopped knowing about a state would draw every
     * task in it as though it had never started.
     */
    var JOURNEY = [
      ["CLAIMED", "claimed"],
      ["PURCHASED", "bought"],
      ["DELIVERED", "arrived"],
      ["REVIEWED", "reviewed"],
      ["HOLDING", "holding"],
      ["REFUNDED", "refunded"],
    ];

    /** What each step says about itself, so colour is never the only signal. */
    var JOURNEY_MARK = { done: "done", current: "now", later: "to come" };

    /**
     * WHICH STEPS THIS OFFER HAS REACHED. REAL STATE, NEVER A PERCENTAGE.
     *
     * The task's own state is the whole answer: the states are ordered, so
     * everything before it happened, and it is where the offer is now. Nothing
     * here is worked out from a proportion, a count or a date — a strip that
     * showed "60% complete" would be a number Fayr does not hold, dressed up as
     * one it does.
     *
     * REFUNDED IS DONE, NOT CURRENT. The money is out and there is nothing in
     * progress, so the last step reads as finished and no step is current. Every
     * other state is a step still being worked through.
     *
     * A STATE THIS LIST HAS NEVER HEARD OF reaches none of them rather than
     * guessing a position. The card still draws the state pill beside the strip,
     * so the truth is on the screen even when the strip cannot place it.
     */
    function journeySteps(task) {
      var state = task && task.state;
      var at = -1;
      for (var i = 0; i < JOURNEY.length; i++) if (JOURNEY[i][0] === state) at = i;
      var finished = at === JOURNEY.length - 1;
      return JOURNEY.map(function (step, ix) {
        var status = "later";
        if (at >= 0) {
          if (ix < at || (finished && ix === at)) status = "done";
          else if (ix === at) status = "current";
        }
        return { key: step[0], word: step[1], status: status, mark: JOURNEY_MARK[status] };
      });
    }

    /**
     * ONE CARD PER CAMPAIGN, even when the same offer was claimed twice.
     *
     * A trail entry names the OFFER it belongs to and not the claim, so two cards
     * for one campaign would show the same entries twice and neither would be
     * wrong about it. The newest claim is the one drawn — the server sends tasks
     * newest first — and a second claim is said in words on the card rather than
     * hidden.
     */
    function offersByCampaign(tasks) {
      var out = [], at = {};
      (tasks || []).forEach(function (t) {
        var id = t && t.campaign && t.campaign.id;
        if (!id) { out.push({ id: null, task: t, claims: 1 }); return; }
        if (Object.prototype.hasOwnProperty.call(at, id)) { at[id].claims += 1; return; }
        at[id] = { id: id, task: t, claims: 1 };
        out.push(at[id]);
      });
      return out;
    }

    /**
     * THE TRAIL, SPLIT — AND EVERY ENTRY LANDS SOMEWHERE.
     *
     * An entry goes to an offer only when it names one AND that offer is on the
     * screen. Everything else — no offer at all, or an offer this person has no
     * task for — goes to "Everything else", because the one thing a trail may
     * never do is drop a line. A gap in a trail is invisible.
     */
    function splitActivityByOffer(entries, offers) {
      var byOffer = {};
      (offers || []).forEach(function (o) { if (o.id) byOffer[o.id] = []; });
      var rest = [];
      (entries || []).forEach(function (e) {
        var id = e && e.campaignId;
        if (id && Object.prototype.hasOwnProperty.call(byOffer, id)) byOffer[id].push(e);
        else rest.push(e);
      });
      return { byOffer: byOffer, rest: rest };
    }

    /**
     * WHO THEY ARE, AND NOTHING INVENTED.
     *
     * Most people have no name: setup can be finished without giving one and the
     * practice data creates none at all. So the missing case is the ordinary one
     * and it is drawn deliberately — the mobile becomes the large line, and a
     * muted "No name given" sits under it.
     *
     * NEVER A PLACEHOLDER. No "Unknown", no dash, nothing that reads like a name.
     * An agent confirming who they are speaking to must not be shown an
     * invention, and a blank space where a name should be is its own kind of
     * invention: it looks like a page that failed to load.
     */
    function IdentityHeader(p, summary) {
      var named = typeof p.name === "string" && p.name !== "";
      return h("div", { class: "card" },
        h("div", { class: "ident" },
          h("div", { style: "min-width:0;flex:1 1 280px" },
            named
              ? h("div", { class: "who-name" }, p.name)
              : h("div", { class: "who-name mono" }, p.mobile),
            named
              ? h("div", { class: "who-mobile mono" }, p.mobile)
              : h("div", { class: "no-name" }, "No name given"),
            h("div", { class: "who-under" },
              h("span", { class: "mono" }, p.displayId),
              h("span", null, "joined " + fmtDay(p.createdAt)),
              pill(p.status, USER_PILL[p.status]))),
          summary
            ? h("div", { style: "flex:1 1 300px;min-width:0" }, ActivitySummary(summary))
            : null));
    }

    /**
     * THE FOUR NUMBERS, AND EACH ONE SAYS WHAT IT IS COUNTING.
     *
     * A supporting line under every number, because a bare 3 on a dashboard gets
     * read as whatever the reader was already thinking about. Every supporting
     * line is a count of real rows or a sentence the trail wrote — there is no
     * proportion here that is not two real numbers.
     *
     * DAYS QUIET IS A DASH UNTIL THE TRAIL IS READ, never a nought. The trail
     * loads after the profile, and a zero drawn while it is still loading says
     * "seen today" about somebody nobody has looked up yet.
     */
    function UserTiles(d, a) {
      var refunded = (d.tasks || []).filter(function (t) { return t.state === "REFUNDED"; }).length;
      var s = a.data ? a.data.summary : null;
      var quietBig = s && s.daysQuiet != null ? fmtCount(s.daysQuiet) : "—";
      var quietUnder = s
        ? activityQuietLine(s) + " Last seen " + fmtDay(s.lastSeen) + "."
        : (a.error ? "The trail could not be read." : "Reading the trail…");
      return h("div", { class: "stat-row" },
        Tile(rupees(d.wallet.balancePaise), "Wallet balance",
          plural((d.wallet.entries || []).length, "entry", "entries") + " in the ledger"),
        Tile(fmtCount(d.tickets.balance), "Tickets",
          plural((d.tickets.entries || []).length, "change", "changes") + " recorded"),
        Tile(fmtCount((d.tasks || []).length), "Offers joined",
          fmtCount(refunded) + " of " + fmtCount((d.tasks || []).length) + " refunded"),
        Tile(quietBig, "Days quiet", quietUnder));
    }

    function Tile(big, label, under) {
      return h("div", { class: "kv" },
        h("div", { class: "stat" }, big),
        h("div", { class: "k" }, label),
        h("div", { class: "muted", style: "font-size:12px;margin-top:3px" }, under));
    }

    /** The six steps, each drawing a bar, its word, and what it says about itself. */
    function JourneyStrip(task) {
      return h("div", { class: "journey" }, journeySteps(task).map(function (s) {
        return h("div", { class: "jstep " + s.status },
          h("div", { class: "jbar" }),
          h("div", { class: "jword" }, s.word),
          h("div", { class: "jmark" }, s.mark));
      }));
    }

    /**
     * WHY THIS REFUND IS NOT THE NUMBER ON THE OFFER.
     *
     * The server works the refund out from what the person paid for that one
     * product, capped at the offer's own price, and records WHICH printed line
     * explains the difference. Until this, the panel could show a refund that was
     * not the offer's percentage of the offer's price with nothing anywhere to
     * say why, and the only way to find out was to open the shop.
     *
     * A NOTE, AND THE PANEL TREATS IT AS ONE. Nothing here decides anything; it
     * is turned into a sentence here rather than on the server because the server
     * keeps the machine name and the person needs the words. An unknown name is
     * printed as itself rather than swallowed, so a name added later is visible
     * the day it first appears instead of silently rendering as nothing.
     */
    var PRICE_GAP_WORDS = {
      "none": null,
      "shop-discount": "The shop had its own discount on it, so they paid less than the offer lists.",
      "coupon": "A discount came off the whole bill. This product's share of it has been taken off too.",
      "fees-on-top": "They paid more than this, but the extra was delivery or handling, which is not refunded.",
      "price-rose": "It cost more than the offer lists, so the refund is worked out on the offer's price.",
      "unknown": "The page did not say why this differs from the offer's price."
    };

    function priceGapLine(t) {
      var why = t.order ? t.order.priceGapReason : null;
      if (!why) return null;
      var words = Object.prototype.hasOwnProperty.call(PRICE_GAP_WORDS, why)
        ? PRICE_GAP_WORDS[why]
        : ("Price gap recorded as \u201c" + why + "\u201d.");
      if (!words) return null;
      return h("div", { class: "muted", style: "font-size:12.5px;margin-top:4px" }, words);
    }

    /**
     * ONE OFFER, WHOLE.
     *
     * The state pill, the practice-window mark and the not-eligible reasons are
     * the ones that used to live in the task list, unchanged: they decide whether
     * somebody releases money and nothing here may quieten them.
     */
    function OfferCard(offer, entries) {
      var t = offer.task;
      var c = t.campaign || {};
      var refund = t.refund || {};
      return h("div", { class: "card offer" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start;gap:14px" },
          h("div", { style: "min-width:0;flex:1 1 200px" },
            h("div", { class: "offer-title" }, c.title || c.productName || "An offer"),
            h("div", { class: "muted", style: "font-size:12.5px;margin-top:2px" },
              (c.platform || "—") + " · claimed " + fmtDay(t.createdAt))),
          h("div", { class: "kv", style: "text-align:right" },
            h("div", { class: "num", style: "font-weight:700;white-space:nowrap" }, rupees(refund.amountPaise)),
            h("div", { class: "k" }, "refund"))),
        h("div", { class: "row", style: "margin-top:10px;gap:8px" },
          pill(t.state, TASK_PILL[t.state]),
          practiceMark(t),
          refund.eligible ? pill("REFUND READY", "ok") : null,
          offer.claims > 1
            ? h("span", { class: "muted", style: "font-size:12px" },
                "claimed " + fmtCount(offer.claims) + " times — the newest is shown")
            : null),
        JourneyStrip(t),
        priceGapLine(t),
        t.windowEndsAt
          ? h("div", { class: "muted", style: "font-size:12.5px" },
              "Return window ends " + fmtDay(t.windowEndsAt) + ".")
          : null,
        (!refund.eligible && refund.reasons && refund.reasons.length)
          ? h("div", { class: "muted", style: "font-size:12.5px;margin-top:4px" },
              "Not eligible: " + refund.reasons.join("; "))
          : null,
        OfferEntries(entries));
    }

    /**
     * THIS OFFER'S OWN ENTRIES, in the order the server sent them.
     *
     * Newest first, like everywhere else on this page, and never re-sorted: the
     * server's order is already total and a second opinion here would disagree
     * with it the first time either changed.
     *
     * The full date on every row rather than a day heading, because a card holds
     * a handful of entries spread over weeks and a heading per day would be
     * mostly headings.
     */
    function OfferEntries(entries) {
      var list = entries || [];
      if (list.length === 0) {
        return h("div", { class: "muted", style: "font-size:12.5px;margin-top:10px" },
          "Nothing recorded for this offer in the window above.");
      }
      return h("div", { style: "margin-top:10px" },
        h("div", { class: "kv", style: "margin-bottom:2px" },
          h("div", { class: "k" }, plural(list.length, "entry", "entries"))),
        list.map(OfferEntryRow));
    }

    function OfferEntryRow(e) {
      var k = ACTIVITY_KIND[e.kind] || { word: e.kind, tone: "var(--neutral)" };
      return h("div", { style: "display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--border)" },
        h("div", {
          class: "num muted",
          style: "flex:0 0 118px;font-size:12px;padding-top:1px",
        }, fmtDate(e.at)),
        h("div", {
          style: "flex:0 0 66px;font-size:11px;font-weight:700;padding-top:2px;"
            + "text-transform:uppercase;letter-spacing:.04em;color:" + k.tone,
        }, k.word),
        h("div", { style: "min-width:0;font-size:13px" },
          h("div", null, e.what),
          e.detail
            ? h("div", { class: "muted", style: "font-size:12px;margin-top:2px" }, e.detail)
            : null));
    }

    /** The offers column. A person with none gets a sentence, never a blank. */
    function OffersColumn(offers, byOffer) {
      if (!offers || offers.length === 0) {
        return h("div", { class: "card" },
          h("h3", null, "Offers"),
          h("div", { class: "empty" },
            "They have not joined an offer yet, so there is nothing to follow here."));
      }
      return h("div", null,
        h("h3", { class: "col-head" }, "Offers",
          h("span", { class: "muted" }, fmtCount(offers.length))),
        offers.map(function (o) {
          return OfferCard(o, o.id ? (byOffer[o.id] || []) : []);
        }));
    }

    /**
     * THE RAIL. The same four tables as before, moved rather than rewritten.
     *
     * They are beside the offers instead of under them because they answer a
     * different question: the offers are what somebody is ringing about, and
     * these are what the answer costs.
     */
    function ContextRail(d) {
      return h("div", null,
        h("h3", { class: "col-head" }, "Money, tickets and questions"),
        h("div", { class: "card" },
          h("h3", null, "Wallet ledger", h("span", { class: "muted" }, rupees(d.wallet.balancePaise))),
          WalletTable(d.wallet.entries)),
        h("div", { class: "card" },
          h("h3", null, "Withdrawals", h("span", { class: "muted" }, fmtCount(d.withdrawals.length))),
          WalletTable(d.withdrawals)),
        h("div", { class: "card" },
          h("h3", null, "Ticket ledger", h("span", { class: "muted" }, fmtCount(d.tickets.balance))),
          TicketTable(d.tickets.entries)),
        h("div", { class: "card" },
          h("h3", null, "Support questions", h("span", { class: "muted" }, fmtCount(d.questions.length))),
          d.questions.length === 0
            ? h("div", { class: "empty" }, "No questions raised.")
            : h("div", null, d.questions.map(function (q) { return ThreadCard(q, { withUser: false }); }))));
    }

    /**
     * EVERYTHING THAT BELONGS TO THE PERSON RATHER THAN TO ONE OFFER.
     *
     * Signing up, screens, sessions, chats, questions — grouped by day and
     * coloured by kind exactly as before, because that part was right.
     *
     * THE TWO EMPTY CASES ARE DIFFERENT SENTENCES. Nothing recorded at all is not
     * the same as everything recorded belonging to an offer above, and one
     * sentence for both would send an agent looking for a longer window that
     * would not help.
     */
    function EverythingElse(a, rest) {
      var body;
      if (!a.data) {
        body = a.error
          ? null
          : h("div", { class: "muted" }, h("span", { class: "spin" }), " Reading…");
      } else if (rest.length === 0) {
        body = a.data.timeline.total === 0
          ? h("div", { class: "empty" }, activityEmptyLine(a.data.window.days))
          : h("div", { class: "empty" },
              "Everything in this window belongs to an offer above.");
      } else {
        // The counts stay the SERVER'S counts — how many it sent and how many it
        // left out — rather than being recomputed from this half of the split.
        // "Showing 500 of 1,342" is about the read, and it is true of the read.
        body = ActivityTimeline({
          window: a.data.window,
          timeline: {
            entries: rest,
            total: a.data.timeline.total,
            shown: a.data.timeline.shown,
            trimmed: a.data.timeline.trimmed,
          },
        });
      }
      return h("div", { class: "card" },
        h("h3", null, "Everything else",
          a.data ? h("span", { class: "muted" }, fmtCount(rest.length)) : null),
        h("div", { class: "muted", style: "font-size:12.5px;margin-bottom:6px" },
          "Signing up, screens, sessions, conversations and questions — what "
          + "belongs to the person rather than to one offer."),
        a.error ? h("div", { class: "flash flash-err" }, a.error) : null,
        body);
    }

    function UserScreen() {
      var back = h("button", { class: "btn btn-sm btn-ghost", onclick: function () { state.screen = state.user.from; render(); } }, "← Back");
      if (state.user.loading) return h("div", null, back, h("div", { class: "muted", style: "margin-top:14px" }, h("span", { class: "spin" }), " Loading activity…"));
      if (state.user.error) return h("div", null, back, h("div", { class: "flash flash-err", style: "margin-top:14px" }, state.user.error));
      var d = state.user.data;
      if (!d) return h("div", null, back);

      var a = state.user.activity;
      var offers = offersByCampaign(d.tasks);
      var split = splitActivityByOffer(a.data ? a.data.timeline.entries : [], offers);

      return h("div", null,
        h("div", { style: "margin-bottom:14px" }, back),
        IdentityHeader(d.profile, a.data ? a.data.summary : null),
        UserTiles(d, a),
        // ONE WINDOW FOR THE WHOLE PAGE. It moves the entries inside the offer
        // cards and the list at the bottom together, because they are two halves
        // of one read and two windows would let them disagree.
        ActivityWindowPicker(),
        h("div", { class: "userpage" },
          h("div", { style: "min-width:0" }, OffersColumn(offers, split.byOffer)),
          h("div", { style: "min-width:0" }, ContextRail(d))),
        EverythingElse(a, split.rest));
    }
    // ── the user page: end ───────────────────────────────────────────────────

    function WalletTable(entries) {
      if (!entries || entries.length === 0) return h("div", { class: "empty" }, "No entries.");
      var rows = entries.map(function (e) {
        var paise = Number(e.amountPaise);
        var cls = paise < 0 ? "amt-neg" : (paise > 0 ? "amt-pos" : "");
        return h("tr", null,
          h("td", { class: "num " + cls, style: "font-weight:700;white-space:nowrap" }, rupees(e.amountPaise)),
          h("td", null, pill(e.kind, "neutral")),
          h("td", null, e.memo || h("span", { class: "muted" }, "—")),
          h("td", { class: "muted", style: "white-space:nowrap" }, fmtDate(e.createdAt)));
      });
      return h("div", { class: "table-wrap" }, h("table", { class: "ledger" },
        h("thead", null, h("tr", null, h("th", null, "Amount"), h("th", null, "Kind"), h("th", null, "Memo"), h("th", null, "When"))),
        h("tbody", null, rows)));
    }

    function TicketTable(entries) {
      if (!entries || entries.length === 0) return h("div", { class: "empty" }, "No entries.");
      var rows = entries.map(function (e) {
        var cls = e.delta < 0 ? "amt-neg" : (e.delta > 0 ? "amt-pos" : "");
        return h("tr", null,
          h("td", { class: "num " + cls, style: "font-weight:700" }, (e.delta > 0 ? "+" : "") + e.delta),
          h("td", { class: "num" }, String(e.balanceAfter)),
          h("td", null, pill(e.reason, "neutral")),
          h("td", { class: "muted", style: "white-space:nowrap" }, fmtDate(e.createdAt)));
      });
      return h("div", { class: "table-wrap" }, h("table", { class: "ledger" },
        h("thead", null, h("tr", null, h("th", null, "Δ"), h("th", null, "Balance"), h("th", null, "Reason"), h("th", null, "When"))),
        h("tbody", null, rows)));
    }

    // Reusable question thread with reply + close. Used in the queue (withUser)
    // and inside a user's activity.
    function ThreadCard(q, o) {
      o = o || {};
      var replies = (q.replies || []).map(function (r) {
        return h("div", { class: "reply " + (r.author === "staff" ? "staff" : "user") },
          h("div", { class: "by" }, r.author === "staff" ? "Staff" : "User", " · ", fmtDate(r.createdAt)),
          h("div", null, r.body));
      });

      var ta = h("textarea", { placeholder: "Write a reply to the user…" });
      var msg = h("div");
      var sendBtn = h("button", { class: "btn btn-primary btn-sm", type: "submit" }, "Send reply");
      var closeBtn = q.status !== "CLOSED"
        ? h("button", { class: "btn btn-sm", type: "button", onclick: onClose }, "Close question")
        : null;

      async function onSend(ev) {
        ev.preventDefault();
        msg.textContent = "";
        var body = ta.value.trim();
        if (!body) { msg.appendChild(h("div", { class: "flash flash-err" }, "Reply can’t be empty.")); return; }
        sendBtn.disabled = true; if (closeBtn) closeBtn.disabled = true;
        try {
          var updated = await api("POST", "/admin/questions/" + q.id + "/reply", { body: body });
          ta.value = "";
          replaceQuestion(updated);
        } catch (e) {
          msg.appendChild(h("div", { class: "flash flash-err" }, e.message));
          sendBtn.disabled = false; if (closeBtn) closeBtn.disabled = false;
        }
      }
      async function onClose() {
        closeBtn.disabled = true; sendBtn.disabled = true;
        try { var updated = await api("POST", "/admin/questions/" + q.id + "/close"); replaceQuestion(updated); }
        catch (e) { msg.appendChild(h("div", { class: "flash flash-err" }, e.message)); closeBtn.disabled = false; sendBtn.disabled = false; }
      }

      var composer = q.status === "CLOSED"
        ? h("div", { class: "muted", style: "margin-top:10px;font-style:italic" }, "This question is closed.")
        : h("form", { class: "composer", onsubmit: onSend }, ta, msg, h("div", { class: "row" }, closeBtn, sendBtn));

      return h("div", { class: "thread" },
        h("div", { class: "row", style: "justify-content:space-between" },
          h("div", { class: "subj" }, q.subject),
          pill(q.status, Q_PILL[q.status])),
        o.withUser && q.user ? h("div", { class: "muted mono", style: "margin-top:3px;font-size:12.5px" },
          q.user.mobile, " · ", q.user.displayId, "  ",
          h("a", { onclick: function () { loadUser(q.user.id, "queue"); } }, "view activity →")) : null,
        h("div", { class: "op" }, q.body),
        replies.length ? h("div", null, replies) : h("div", { class: "muted", style: "font-size:12.5px" }, "No replies yet."),
        composer);
    }

    function AppView() {
      // A role landing on a screen it can't see (stale session / hand-typed) is
      // redirected to its default; the server still enforces the real gate.
      if (state.screen !== "user" && !roleCanSee(state.screen)) state.screen = defaultScreen();
      var content;
      if (state.screen === "running") content = RunningScreen();
      else if (state.screen === "growth") content = GrowthScreen();
      else if (state.screen === "withdrawals") content = WithdrawalsScreen();
      else if (state.screen === "queue") content = QueueScreen();
      else if (state.screen === "verifications") content = VerificationsScreen();
      else if (state.screen === "amounts") content = AmountsScreen();
      else if (state.screen === "reviews") content = ReviewChecksScreen();
      else if (state.screen === "chats") content = ConversationsScreen();
      else if (state.screen === "chat") content = ChatQuestionsScreen();
      else if (state.screen === "answers") content = AnswerBookScreen();
      else if (state.screen === "livepages") content = LivePagesScreen();
      else if (state.screen === "offers") content = OffersScreen();
      else if (state.screen === "campaigns") content = CampaignsScreen();
      else if (state.screen === "reports") content = ReportsScreen();
      else if (state.screen === "search") content = SearchScreen();
      else if (state.screen === "staff") content = StaffScreen();
      else if (state.screen === "user") content = UserScreen();
      return h("div", { class: "shell" },
        Sidebar(),
        h("div", { class: "pane" }, Topbar(), h("main", null, content)));
    }

    // ── Mount / boot ────────────────────────────────────────────────────────
    function render() {
      var root = document.getElementById("root");
      root.textContent = "";
      root.appendChild(state.view === "login" ? LoginView() : AppView());
    }
    async function boot() {
      if (state.token) {
        try {
          var me = await api("GET", "/admin/auth/me");
          state.staff = me; state.view = "app"; state.screen = defaultScreen(); saveSession();
          render(); loadForScreen(state.screen); primeBadges(); return;
        } catch (e) { /* 401 already routed to logout(); other errors fall through */ }
      }
      state.view = "login"; render();
    }
    boot();
  })();
  </script>
</body>
</html>
