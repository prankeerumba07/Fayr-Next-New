<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Fayr · Support Panel</title>
  <style>
    /* ── Theme tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #eef0f4;
      --border: #e0e3ea;
      --text: #191c22;
      --muted: #697084;
      --accent: #3b5bdb;
      --accent-fg: #ffffff;
      --ok: #2f9e44;
      --warn: #d9820b;
      --bad: #e03131;
      --info: #3b5bdb;
      --neutral: #7a8194;
      --shadow: 0 1px 2px rgba(20,24,33,.05), 0 4px 16px rgba(20,24,33,.06);
      --mono: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --surface: #161a20;
        --surface-2: #1e232b;
        --border: #2a303a;
        --text: #e6e8ec;
        --muted: #98a1b0;
        --accent: #5c7cfa;
        --accent-fg: #0e1116;
        --ok: #51cf66;
        --warn: #ffa94d;
        --bad: #ff6b6b;
        --info: #74a0ff;
        --neutral: #8b93a4;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mono { font-family: var(--mono); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }

    /* ── Buttons / inputs ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); border-radius: 8px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .12s, border-color .12s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.06); background: var(--accent); }
    .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
    .btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
    input[type=text], input[type=email], input[type=password], textarea {
      width: 100%; font-family: inherit; font-size: 14px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    label.field { display: block; margin-bottom: 12px; }
    label.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }

    /* ── Pills ────────────────────────────────────────────────────────────── */
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
    .pill-ok      { color: var(--ok);      background: color-mix(in srgb, var(--ok) 15%, transparent); }
    .pill-warn    { color: var(--warn);    background: color-mix(in srgb, var(--warn) 16%, transparent); }
    .pill-bad     { color: var(--bad);     background: color-mix(in srgb, var(--bad) 15%, transparent); }
    .pill-info    { color: var(--info);    background: color-mix(in srgb, var(--info) 15%, transparent); }
    .pill-neutral { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 16%, transparent); }

    /* ── Console layout ───────────────────────────────────────────────────────
       A fixed sidebar and a scrolling work pane. The sidebar never scrolls with
       the content: an operator working a queue should always be able to see what
       else is waiting.                                                        */
    .shell { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      flex: 0 0 232px; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 16px 12px 12px; overflow-y: auto;
    }
    .brand { font-weight: 800; letter-spacing: -.02em; font-size: 20px; padding: 0 10px 16px; }
    .brand .dot { color: var(--accent); }
    .brand-sub {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-left: 7px; vertical-align: 3px;
    }
    .sidebar nav { flex: 1; }
    .nav-group { margin-bottom: 18px; }
    .nav-head {
      font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--muted); padding: 0 10px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      font-weight: 600; color: var(--muted); line-height: 1.3;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .nav-glyph { width: 18px; text-align: center; font-size: 13px; opacity: .85; }
    .nav-label { flex: 1; min-width: 0; }
    .nav-badge {
      background: var(--accent); color: var(--accent-fg);
      border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .nav-item.active .nav-badge { background: var(--accent); color: var(--accent-fg); }
    .sidebar-foot { border-top: 1px solid var(--border); padding-top: 10px; }
    .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .who-avatar {
      flex: 0 0 30px; height: 30px; border-radius: 999px;
      background: var(--surface-2); color: var(--text);
      display: grid; place-items: center; font-size: 11.5px; font-weight: 700;
    }
    .who .email {
      font-weight: 600; font-size: 12.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .role-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .07em;
      color: var(--muted); text-transform: uppercase;
    }

    .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    header.top {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .top-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .top-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
    .spacer { flex: 1; }
    .quickfind {
      width: 260px; padding: 7px 11px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 13px;
    }
    .quickfind:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    main { flex: 1; overflow-y: auto; max-width: 1080px; width: 100%; padding: 20px 24px 80px; }

    @media (max-width: 860px) {
      .shell { flex-direction: column; height: auto; overflow: visible; }
      .sidebar { flex: 0 0 auto; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar nav { display: flex; gap: 16px; flex-wrap: wrap; }
      .pane { overflow: visible; }
      .quickfind { width: 160px; }
    }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
    .card > h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .kv .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .kv .v { font-size: 15px; font-weight: 600; margin-top: 2px; }

    table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.ledger th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    table.ledger td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.ledger tr:last-child td { border-bottom: none; }
    .amt-pos { color: var(--ok); }
    .amt-neg { color: var(--bad); }
    .table-wrap { overflow-x: auto; }

    .task { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface-2); }
    .task:last-child { margin-bottom: 0; }
    .task .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .task .title { font-weight: 700; }
    .task .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }

    .thread { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
    .thread:last-child { margin-bottom: 0; }
    .thread .subj { font-weight: 700; font-size: 15px; }
    .thread .op { margin: 8px 0 12px; white-space: pre-wrap; }
    .reply { border-left: 3px solid var(--border); padding: 4px 0 4px 12px; margin: 8px 0; white-space: pre-wrap; }
    .reply.staff { border-left-color: var(--accent); }
    .reply .by { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .reply.staff .by { color: var(--accent); }
    .composer { margin-top: 12px; }
    .composer .row { justify-content: flex-end; margin-top: 8px; }

    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
    .flash-err { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
    .flash-info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); border: 1px solid color-mix(in srgb, var(--info) 28%, transparent); }
    .empty { color: var(--muted); font-style: italic; padding: 6px 0; }

    /* ── Login ────────────────────────────────────────────────────────────── */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card .brand { font-size: 22px; margin-bottom: 4px; }
    .login-card .sub { color: var(--muted); margin-bottom: 20px; }
    .apibase { font-size: 12px; color: var(--muted); margin-top: 16px; word-break: break-all; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (function () {
    "use strict";

    // ── API base resolution ────────────────────────────────────────────────
    // Priority: ?api= override → saved override → same-origin (served through a
    // proxy/tunnel on a standard port) → same host on :3000 (local static serve).
    function resolveApiBase() {
      var p = new URLSearchParams(location.search);
      var q = p.get("api");
      if (q) return q.replace(/\/$/, "");
      var saved = sessionStorage.getItem("fayr_admin_apibase");
      if (saved) return saved;
      if (location.protocol === "file:") return "http://localhost:3000";
      var port = location.port;
      if (!port || port === "80" || port === "443") return location.origin;
      return location.protocol + "//" + location.hostname + ":3000";
    }
    var API_BASE = resolveApiBase();

    // ── Session state ───────────────────────────────────────────────────────
    var SS = "fayr_admin_";
    var state = {
      token: sessionStorage.getItem(SS + "token") || null,
      staff: JSON.parse(sessionStorage.getItem(SS + "staff") || "null"),
      view: "login",       // login | app
      screen: "withdrawals", // withdrawals | queue | search | staff | user
      flash: null,
      withdrawals: { loading: false, error: null, items: null, filter: "REQUESTED" },
      queue: { loading: false, error: null, items: null },
      search: { mobile: "", loading: false, error: null, notFound: false, result: null },
      staffMgmt: { loading: false, error: null, items: null },
      campaigns: { loading: false, error: null, items: null, filter: "ALL" },
      reports: { type: null, from: null, to: null, granularity: "", loading: false, error: null, data: null },
      user: { loading: false, error: null, data: null, from: "search" },
      verifications: {
        loading: false, error: null, items: null, notice: null,
        selId: null, detail: null, detailLoading: false, detailError: null,
        imgUrl: null, imgLoading: false, busy: false, actionError: null
      },
      // Refunds waiting on somebody stating how many units were bought. A work
      // queue, so it carries a badge count like the others.
      amounts: { loading: false, error: null, items: null, total: null, busy: null, actionError: null, notice: null },
      // Reviews only a person can check — Meesho keeps the words inside its app,
      // so no machine can ever say whether the review is on the page.
      reviews: { loading: false, error: null, items: null, total: null, busy: null, actionError: null, notice: null }
    };
    function freshAmounts() {
      return { loading: false, error: null, items: null, total: null, busy: null, actionError: null, notice: null };
    }
    function freshReviews() {
      return { loading: false, error: null, items: null, total: null, busy: null, actionError: null, notice: null };
    }
    // A fresh, empty verifications slice — used at init and on logout.
    function freshVerifications() {
      return {
        loading: false, error: null, items: null, notice: null,
        selId: null, detail: null, detailLoading: false, detailError: null,
        imgUrl: null, imgLoading: false, busy: false, actionError: null
      };
    }
    // Which tabs each staff role may see. ADMIN sees everything; the others get a
    // single functional area. This MIRRORS the backend RBAC (RolesGuard) — the
    // server is the real gate, this just hides what a role can't use.
    var TAB_ROLES = {
      withdrawals: ["FINANCE", "ADMIN"],
      queue: ["SUPPORT", "ADMIN"],
      verifications: ["SUPPORT", "ADMIN"],
      amounts: ["SUPPORT", "ADMIN"],
      reviews: ["SUPPORT", "ADMIN"],
      campaigns: ["OPERATIONS", "ADMIN"],
      reports: ["OPERATIONS", "FINANCE", "ADMIN"],
      search: ["SUPPORT", "FINANCE", "ADMIN"],
      staff: ["ADMIN"],
    };
    function roleCanSee(tab) {
      var role = state.staff && state.staff.role;
      return !!role && TAB_ROLES[tab] && TAB_ROLES[tab].indexOf(role) !== -1;
    }
    // The tab a role lands on after login: the first one it's allowed to see.
    function defaultScreen() {
      var order = ["withdrawals", "queue", "verifications", "amounts", "reviews", "campaigns", "reports", "search", "staff"];
      for (var i = 0; i < order.length; i++) if (roleCanSee(order[i])) return order[i];
      return "search";
    }
    // Lazily load a tab's data the first time it's shown.
    function loadForScreen(id) {
      if (id === "queue" && state.queue.items === null && !state.queue.loading) loadQueue();
      else if (id === "verifications" && state.verifications.items === null && !state.verifications.loading) loadVerifications();
      else if (id === "withdrawals" && state.withdrawals.items === null && !state.withdrawals.loading) loadWithdrawals();
      else if (id === "staff" && state.staffMgmt.items === null && !state.staffMgmt.loading) loadStaff();
      else if (id === "campaigns" && state.campaigns.items === null && !state.campaigns.loading) loadCampaigns();
      else if (id === "reports" && state.reports.data === null && !state.reports.loading) openReports();
      else if (id === "amounts" && state.amounts.items === null && !state.amounts.loading) loadAmounts();
      else if (id === "reviews" && state.reviews.items === null && !state.reviews.loading) loadReviewChecks();
    }
    function saveSession() {
      if (state.token) sessionStorage.setItem(SS + "token", state.token);
      else sessionStorage.removeItem(SS + "token");
      if (state.staff) sessionStorage.setItem(SS + "staff", JSON.stringify(state.staff));
      else sessionStorage.removeItem(SS + "staff");
    }

    // ── HTTP ────────────────────────────────────────────────────────────────
    function ApiError(status, message) { this.status = status; this.message = message; }
    async function api(method, path, body, opts) {
      opts = opts || {};
      var init = { method: method, headers: {} };
      if (state.token) init.headers["Authorization"] = "Bearer " + state.token;
      if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
      var res;
      try { res = await fetch(API_BASE + path, init); }
      catch (e) { throw new ApiError(0, "Can’t reach the Fayr server at " + API_BASE + ". Is the backend running?"); }
      if (res.status === 401 && !opts.noAuthRedirect) {
        logout("Your session expired — please sign in again.");
        throw new ApiError(401, "Unauthorized");
      }
      var txt = await res.text(), data = null;
      if (txt) { try { data = JSON.parse(txt); } catch (e) { data = txt; } }
      if (!res.ok) {
        var m = (data && data.message) || (typeof data === "string" && data) || ("Request failed (" + res.status + ")");
        throw new ApiError(res.status, Array.isArray(m) ? m.join(", ") : m);
      }
      return data;
    }

    // Multipart upload (the JSON `api()` can't carry a file). Lets the browser set
    // the multipart boundary; only the Authorization header is added.
    async function apiUpload(path, file) {
      var fd = new FormData();
      fd.append("file", file);
      var init = { method: "POST", headers: {}, body: fd };
      if (state.token) init.headers["Authorization"] = "Bearer " + state.token;
      var res;
      try { res = await fetch(API_BASE + path, init); }
      catch (e) { throw new ApiError(0, "Can’t reach the Fayr server at " + API_BASE + "."); }
      if (res.status === 401) { logout("Your session expired — please sign in again."); throw new ApiError(401, "Unauthorized"); }
      var txt = await res.text(), data = null;
      if (txt) { try { data = JSON.parse(txt); } catch (e) { data = txt; } }
      if (!res.ok) {
        var m = (data && data.message) || (typeof data === "string" && data) || ("Upload failed (" + res.status + ")");
        throw new ApiError(res.status, Array.isArray(m) ? m.join(", ") : m);
      }
      return data;
    }

    // ── DOM helper (children are text nodes unless already elements → XSS-safe) ─
    function h(tag, attrs) {
      var e = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          var v = attrs[k];
          if (v == null || v === false) continue;
          if (k === "class") e.className = v;
          else if (k === "text") e.textContent = v;
          else if (k === "dataset") { for (var d in v) e.dataset[d] = v[d]; }
          else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
          else e.setAttribute(k, v);
        }
      }
      for (var i = 2; i < arguments.length; i++) {
        var kids = arguments[i];
        if (!Array.isArray(kids)) kids = [kids];
        for (var j = 0; j < kids.length; j++) {
          var c = kids[j];
          if (c == null || c === false) continue;
          e.appendChild((typeof c === "string" || typeof c === "number") ? document.createTextNode(String(c)) : c);
        }
      }
      return e;
    }

    // SVG sibling of h() — createElementNS so <svg> children render; text via
    // textContent stays XSS-safe (chart labels can include campaign titles).
    function s(tag, attrs) {
      var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
      if (attrs) for (var k in attrs) { var v = attrs[k]; if (v == null || v === false) continue; if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
      for (var i = 2; i < arguments.length; i++) { var kids = arguments[i]; if (!Array.isArray(kids)) kids = [kids]; for (var j = 0; j < kids.length; j++) { var c = kids[j]; if (c == null || c === false) continue; e.appendChild((typeof c === "string" || typeof c === "number") ? document.createTextNode(String(c)) : c); } }
      return e;
    }

    // ── Formatting ────────────────────────────────────────────────────────────
    function rupees(paiseStr) {
      if (paiseStr == null) return "—";
      var paise = Number(paiseStr);
      if (!isFinite(paise)) return "—";
      return (paise / 100).toLocaleString("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 });
    }
    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-IN", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function fmtDay(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("en-IN", { year: "numeric", month: "short", day: "numeric" });
    }
    // Campaign money is integer-paise strings on the wire, but operators think in
    // rupees — so the form shows/accepts rupees and converts at the boundary.
    function paiseToRupeeInput(paiseStr) {
      if (paiseStr == null || paiseStr === "") return "";
      var n = Number(paiseStr);
      return isFinite(n) ? String(n / 100) : "";
    }
    function rupeeInputToPaise(str) {
      var s = (str == null ? "" : String(str)).trim();
      if (s === "") return null;
      var n = Number(s);
      if (!isFinite(n) || n < 0) return null;
      return String(Math.round(n * 100)); // integer paise, as a string
    }
    // Uploaded images come back as root-relative "/uploads/…" — resolve them
    // against the API host so the panel (served from :8090) can show them.
    function imgSrc(url) {
      if (!url) return "";
      return url.charAt(0) === "/" ? API_BASE + url : url;
    }
    var TASK_PILL = { CLAIMED: "info", PURCHASED: "info", DELIVERED: "info", REVIEWED: "info", HOLDING: "warn", REFUNDED: "ok", EXPIRED: "neutral", CLOSED: "neutral", REJECTED: "bad", CANCELLED: "neutral" };
    var Q_PILL = { OPEN: "warn", ANSWERED: "info", CLOSED: "neutral" };
    var USER_PILL = { ACTIVE: "ok", BLOCKED: "bad" };
    var WD_PILL = { REQUESTED: "warn", APPROVED: "info", PAID: "ok", REJECTED: "bad", FAILED: "bad" };
    var ROLE_PILL = { SUPPORT: "info", FINANCE: "warn", OPERATIONS: "info", ADMIN: "ok" };
    var STAFF_STATUS_PILL = { ACTIVE: "ok", DISABLED: "neutral" };
    var STAFF_ROLES = ["SUPPORT", "FINANCE", "OPERATIONS", "ADMIN"];
    var CAMP_PILL = { DRAFT: "neutral", ACTIVE: "ok", PAUSED: "warn", ENDED: "bad" };
    // OCR verification pills. Verdict drives triage colour (mismatch/partial = attention).
    var VERDICT_PILL = { MATCH: "ok", PARTIAL: "warn", MISMATCH: "bad", UNKNOWN: "neutral" };
    var SUB_STATUS_PILL = { UPLOADED: "neutral", EXTRACTING: "info", EXTRACTED: "info", FAILED: "bad", APPROVED: "ok", REJECTED: "bad", NEEDS_MORE: "warn" };
    var KIND_LABEL = { PURCHASE: "Purchase", DELIVERY: "Delivery", REVIEW: "Review" };
    // Sort weight so the riskiest cases surface first in the queue.
    var VERDICT_WEIGHT = { MISMATCH: 0, PARTIAL: 1, UNKNOWN: 2, MATCH: 3 };
    var PLATFORMS = ["AMAZON", "FLIPKART", "MEESHO", "MYNTRA", "BLINKIT", "ZEPTO", "INSTAMART"];
    function pill(txt, kind) { return h("span", { class: "pill pill-" + (kind || "neutral"), text: txt }); }
    // The currently-open campaign create/edit form: null (closed), or
    // { mode: "create" | "edit", campaign }. Held outside `state` so typing in the
    // form never triggers a re-render (inputs live in the CampaignForm closure).
    var campaignForm = null;

    // ── Auth actions ──────────────────────────────────────────────────────────
    async function doLogin(email, password) {
      var data = await api("POST", "/admin/auth/login", { email: email, password: password }, { noAuthRedirect: true });
      state.token = data.accessToken;
      state.staff = data.staff;
      state.view = "app";
      state.screen = defaultScreen();
      state.flash = null;
      saveSession();
      render();
      loadForScreen(state.screen);
      primeBadges();
    }

    // Load the queues this role can see, so the sidebar counts mean something on
    // arrival instead of appearing one at a time as tabs are opened. Failures are
    // swallowed: a badge that cannot be counted simply does not show, and each
    // screen still reports its own errors properly when opened.
    function primeBadges() {
      if (roleCanSee("withdrawals") && state.withdrawals.items === null && !state.withdrawals.loading) loadWithdrawals();
      if (roleCanSee("queue") && state.queue.items === null && !state.queue.loading) loadQueue();
      if (roleCanSee("verifications") && state.verifications.items === null && !state.verifications.loading) loadVerifications();
      if (roleCanSee("amounts") && state.amounts.items === null && !state.amounts.loading) loadAmounts();
      if (roleCanSee("reviews") && state.reviews.items === null && !state.reviews.loading) loadReviewChecks();
    }
    function logout(msg) {
      state.token = null; state.staff = null;
      state.view = "login"; state.flash = msg || null;
      state.withdrawals = { loading: false, error: null, items: null, filter: "REQUESTED" };
      state.queue = { loading: false, error: null, items: null };
      state.search = { mobile: "", loading: false, error: null, notFound: false, result: null };
      state.staffMgmt = { loading: false, error: null, items: null };
      state.campaigns = { loading: false, error: null, items: null, filter: "ALL" };
      state.reports = { type: null, from: null, to: null, granularity: "", loading: false, error: null, data: null };
      state.user = { loading: false, error: null, data: null, from: "search" };
      if (state.verifications.imgUrl) URL.revokeObjectURL(state.verifications.imgUrl);
      state.verifications = freshVerifications();
      state.amounts = freshAmounts();
      state.reviews = freshReviews();
      campaignForm = null;
      saveSession();
      render();
    }

    // ── Data loads ────────────────────────────────────────────────────────────
    async function loadQueue() {
      state.queue.loading = true; state.queue.error = null; render();
      try { state.queue.items = await api("GET", "/admin/questions?status=OPEN"); }
      catch (e) { state.queue.error = e.message; }
      state.queue.loading = false; render();
    }
    async function loadWithdrawals() {
      state.withdrawals.loading = true; state.withdrawals.error = null; render();
      try {
        var f = state.withdrawals.filter;
        var qs = (f && f !== "ALL") ? "?status=" + encodeURIComponent(f) : "";
        state.withdrawals.items = await api("GET", "/admin/withdrawals" + qs);
      } catch (e) { state.withdrawals.error = e.message; }
      state.withdrawals.loading = false; render();
    }
    async function loadStaff() {
      state.staffMgmt.loading = true; state.staffMgmt.error = null; render();
      try { state.staffMgmt.items = await api("GET", "/admin/staff"); }
      catch (e) { state.staffMgmt.error = e.message; }
      state.staffMgmt.loading = false; render();
    }
    async function loadCampaigns() {
      state.campaigns.loading = true; state.campaigns.error = null; render();
      try {
        var f = state.campaigns.filter;
        var qs = (f && f !== "ALL") ? "?status=" + encodeURIComponent(f) : "";
        state.campaigns.items = await api("GET", "/admin/campaigns" + qs);
      } catch (e) { state.campaigns.error = e.message; }
      state.campaigns.loading = false; render();
    }
    function normalizeMobile(raw) {
      var s = (raw || "").trim().replace(/[\s-]/g, "");
      if (!s) return "";
      if (s[0] === "+") return s;
      if (/^\d{10}$/.test(s)) return "+91" + s;
      if (/^91\d{10}$/.test(s)) return "+" + s;
      if (/^0\d{10}$/.test(s)) return "+91" + s.slice(1);
      return s;
    }
    async function doSearch(raw) {
      var mobile = normalizeMobile(raw);
      state.search = { mobile: mobile, loading: true, error: null, notFound: false, result: null };
      render();
      try {
        state.search.result = await api("GET", "/admin/users/search?mobile=" + encodeURIComponent(mobile));
      } catch (e) {
        if (e.status === 404) state.search.notFound = true;
        else state.search.error = e.message;
      }
      state.search.loading = false; render();
    }
    async function loadUser(id, from) {
      state.user = { loading: true, error: null, data: null, from: from || "search" };
      state.screen = "user"; render();
      try { state.user.data = await api("GET", "/admin/users/" + id); }
      catch (e) { state.user.error = e.message; }
      state.user.loading = false; render();
    }

    // Replace a question in whatever list currently holds it, then re-render.
    function replaceQuestion(updated) {
      if (state.queue.items) {
        for (var i = 0; i < state.queue.items.length; i++)
          if (state.queue.items[i].id === updated.id) state.queue.items[i] = updated;
      }
      if (state.user.data && state.user.data.questions) {
        for (var j = 0; j < state.user.data.questions.length; j++)
          if (state.user.data.questions[j].id === updated.id) state.user.data.questions[j] = updated;
      }
      render();
    }

    // Merge an action result back into the withdrawals list. The approve/reject/
    // mark-paid responses omit the user + payoutMethod context the list row shows,
    // so we merge onto the existing row rather than replacing it wholesale.
    function replaceWithdrawal(updated) {
      if (state.withdrawals.items) {
        for (var i = 0; i < state.withdrawals.items.length; i++)
          if (state.withdrawals.items[i].id === updated.id)
            state.withdrawals.items[i] = Object.assign({}, state.withdrawals.items[i], updated);
      }
      render();
    }

    // ── Views ─────────────────────────────────────────────────────────────────
    function LoginView() {
      var emailIn = h("input", { type: "email", autocomplete: "username", placeholder: "you@fayr.app", value: "" });
      var passIn = h("input", { type: "password", autocomplete: "current-password", placeholder: "••••••••••••" });
      var errBox = h("div");
      var btn = h("button", { class: "btn btn-primary", type: "submit" }, "Sign in");

      async function submit(ev) {
        ev.preventDefault();
        errBox.textContent = "";
        var email = emailIn.value.trim(), pass = passIn.value;
        if (!email || !pass) { errBox.appendChild(h("div", { class: "flash flash-err" }, "Enter your email and password.")); return; }
        btn.disabled = true; btn.textContent = ""; btn.appendChild(h("span", { class: "spin" })); btn.appendChild(document.createTextNode(" Signing in…"));
        try { await doLogin(email, pass); }
        catch (e) {
          var msg = e.status === 401 ? "Invalid email or password." : e.message;
          errBox.appendChild(h("div", { class: "flash flash-err" }, msg));
          btn.disabled = false; btn.textContent = "Sign in";
        }
      }

      var form = h("form", { onsubmit: submit },
        h("div", { class: "brand" }, "Fayr ", h("span", { class: "dot" }, "·"), " Support"),
        h("div", { class: "sub" }, "Staff sign-in"),
        state.flash ? h("div", { class: "flash flash-info" }, state.flash) : null,
        errBox,
        h("label", { class: "field" }, h("span", null, "Email"), emailIn),
        h("label", { class: "field" }, h("span", null, "Password"), passIn),
        btn,
        h("div", { class: "apibase" }, "API: " + API_BASE)
      );
      return h("div", { class: "login-wrap" }, h("div", { class: "card login-card" }, form));
    }

    // ── Console shell ───────────────────────────────────────────────────────
    // The navigation is GROUPED rather than a flat strip, because the seven areas
    // are not peers: three are work queues someone is expected to clear, two are
    // things you maintain, two are things you look at. A queue with items waiting
    // carries a count, so an operator can see where the work is without opening
    // each one.
    var NAV_GROUPS = [
      ["Queues", [
        ["withdrawals", "Withdrawals", "₹"],
        ["queue", "Questions", "✉"],
        ["verifications", "Screenshots", "▣"],
        ["amounts", "Unit counts", "#"],
        ["reviews", "Review checks", "★"],
      ]],
      ["Catalogue", [
        ["campaigns", "Campaigns", "◈"],
        ["staff", "Staff", "◍"],
      ]],
      ["Insight", [
        ["reports", "Reports", "◱"],
        ["search", "Find a user", "⌕"],
      ]],
    ];

    // How many items are waiting in each queue. Null until that queue has been
    // loaded once — a badge showing 0 when nothing has been counted would be a
    // claim we cannot make.
    function pendingCount(id) {
      if (id === "withdrawals") {
        if (!state.withdrawals.items) return null;
        return state.withdrawals.items.filter(function (w) { return w.status === "REQUESTED"; }).length;
      }
      if (id === "queue") {
        if (!state.queue.items) return null;
        return state.queue.items.filter(function (q) { return q.status !== "CLOSED"; }).length;
      }
      if (id === "verifications") {
        if (!state.verifications.items) return null;
        return state.verifications.total != null
          ? state.verifications.total
          : state.verifications.items.length;
      }
      if (id === "amounts") {
        if (!state.amounts.items) return null;
        return state.amounts.total != null ? state.amounts.total : state.amounts.items.length;
      }
      if (id === "reviews") {
        if (!state.reviews.items) return null;
        // Already-confirmed cards stay on screen so a mistake can be undone, but
        // they are not WORK — counting them would send someone looking for a job
        // that is already done.
        return state.reviews.items.filter(function (it) { return !it.confirmedVisible; }).length;
      }
      return null;
    }

    function Sidebar() {
      var groups = NAV_GROUPS.map(function (g) {
        var items = g[1].filter(function (d) { return roleCanSee(d[0]); });
        if (!items.length) return null; // a role that owns nothing here sees no heading
        return h("div", { class: "nav-group" },
          h("div", { class: "nav-head" }, g[0]),
          h("div", null, items.map(function (d) {
            var id = d[0], count = pendingCount(id);
            return h("div", {
              class: "nav-item" + (state.screen === id ? " active" : ""),
              role: "button", tabindex: "0",
              onclick: function () { switchTab(id); },
              onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchTab(id); } }
            },
              h("span", { class: "nav-glyph" }, d[2]),
              h("span", { class: "nav-label" }, d[1]),
              count ? h("span", { class: "nav-badge" }, String(count)) : null);
          })));
      }).filter(Boolean);

      return h("aside", { class: "sidebar" },
        h("div", { class: "brand" }, "fayr", h("span", { class: "dot" }, "."), h("span", { class: "brand-sub" }, "ops")),
        h("nav", null, groups),
        h("div", { class: "sidebar-foot" },
          h("div", { class: "who" },
            h("div", { class: "who-avatar" }, initialsOf(state.staff)),
            h("div", { style: "min-width:0" },
              h("div", { class: "email", title: state.staff ? state.staff.email : "" }, state.staff ? state.staff.email : ""),
              h("div", { class: "role-tag" }, state.staff ? state.staff.role : ""))),
          h("button", { class: "btn btn-sm btn-ghost", style: "width:100%;margin-top:8px", onclick: function () { logout(); } }, "Log out")));
    }

    function initialsOf(staff) {
      if (!staff) return "?";
      var src = staff.name || staff.email || "?";
      var parts = String(src).replace(/@.*/, "").split(/[.\s_-]+/).filter(Boolean);
      return ((parts[0] || "?")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
    }

    var SCREEN_TITLE = {
      withdrawals: ["Withdrawals", "Money leaving Fayr. Approve, reject, then mark paid once the transfer is out."],
      queue: ["Questions", "Users waiting on an answer. Oldest first."],
      verifications: ["Screenshot verifications", "Tier-3 supporting evidence. Nothing here approves itself."],
      amounts: ["Unit counts", "Refunds waiting on how many units were bought. Nothing here pays until someone says."],
      reviews: ["Review checks", "Reviews no machine can find. Open the page, then say what you see."],
      campaigns: ["Campaigns", "The offers users can claim."],
      reports: ["Reports", "Counts and totals, downloadable as a spreadsheet."],
      search: ["Find a user", "Look someone up by mobile number."],
      staff: ["Staff accounts", "Who can sign in here, and what they can reach."],
      user: ["User", "Everything Fayr holds on one person."]
    };

    function Topbar() {
      var t = SCREEN_TITLE[state.screen] || ["", ""];
      return h("header", { class: "top" },
        h("div", { style: "min-width:0" },
          h("h1", { class: "top-title" }, t[0]),
          h("div", { class: "top-sub" }, t[1])),
        h("div", { class: "spacer" }),
        // A jump-to-user box on every screen: the commonest ops task starts with
        // a person, and hunting for the right tab first is friction.
        roleCanSee("search") ? QuickFind() : null);
    }

    function QuickFind() {
      var input = h("input", { class: "quickfind", type: "search", placeholder: "Jump to a user by mobile…", "aria-label": "Find a user by mobile number" });
      function go(e) {
        e.preventDefault();
        var v = input.value.trim();
        if (!v) return;
        state.screen = "search";
        doSearch(v); // owns the search slice + the re-render
      }
      return h("form", { onsubmit: go }, input);
    }
    function switchTab(id) {
      campaignForm = null; // don't carry a half-filled campaign form across tabs
      state.screen = id; render();
      loadForScreen(id);
    }

    // Staff-account management (ADMIN only): create accounts and change role /
    // status. The server is the real gate; this is the console for it.
    function StaffScreen() {
      // Create form.
      var emailIn = h("input", { type: "email", placeholder: "name@fayr.app" });
      var nameIn = h("input", { type: "text", placeholder: "Full name" });
      var roleSel = h("select", null, STAFF_ROLES.map(function (r) { return h("option", { value: r }, r); }));
      var passIn = h("input", { type: "password", placeholder: "Temp password (min 12 chars)" });
      var createMsg = h("div");
      var createBtn = h("button", { class: "btn btn-primary btn-sm", type: "submit" }, "Create account");
      async function onCreate(ev) {
        ev.preventDefault();
        createMsg.textContent = "";
        createBtn.disabled = true;
        try {
          await api("POST", "/admin/staff", { email: emailIn.value.trim(), name: nameIn.value.trim(), role: roleSel.value, password: passIn.value });
          emailIn.value = ""; nameIn.value = ""; passIn.value = ""; roleSel.value = "SUPPORT";
          await loadStaff();
        } catch (e) {
          createMsg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message));
          createBtn.disabled = false;
        }
      }
      var createCard = h("div", { class: "card" },
        h("h3", { style: "margin-top:0" }, "Add a staff account"),
        h("form", { onsubmit: onCreate },
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap" },
            h("label", { class: "field", style: "flex:1;min-width:180px" }, h("span", null, "Email"), emailIn),
            h("label", { class: "field", style: "flex:1;min-width:160px" }, h("span", null, "Name"), nameIn)),
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;margin-top:2px" },
            h("label", { class: "field", style: "flex:0 0 160px" }, h("span", null, "Role"), roleSel),
            h("label", { class: "field", style: "flex:1;min-width:180px" }, h("span", null, "Temp password"), passIn)),
          h("div", { class: "row", style: "margin-top:4px" }, createBtn),
          createMsg));

      // List + role/status controls.
      var body;
      if (state.staffMgmt.loading && !state.staffMgmt.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (state.staffMgmt.error) body = h("div", { class: "flash flash-err" }, state.staffMgmt.error);
      else if (!state.staffMgmt.items || state.staffMgmt.items.length === 0) body = h("div", { class: "empty" }, "No staff accounts.");
      else body = h("div", null, state.staffMgmt.items.map(StaffRow));

      return h("div", null,
        h("div", { class: "row", style: "justify-content:space-between;margin-bottom:12px" },
          h("h2", { style: "margin:0;font-size:18px" }, "Staff",
            state.staffMgmt.items ? h("span", { class: "muted", style: "font-weight:500;font-size:14px" }, "  " + state.staffMgmt.items.length) : null),
          h("button", { class: "btn btn-sm", onclick: function () { loadStaff(); } }, "Refresh")),
        createCard,
        h("div", { style: "height:14px" }),
        body);
    }

    function StaffRow(s) {
      var isSelf = state.staff && state.staff.id === s.id;
      var msg = h("div");
      async function patch(payload) {
        msg.textContent = "";
        try { var updated = await api("PATCH", "/admin/staff/" + s.id, payload);
          for (var i = 0; i < state.staffMgmt.items.length; i++) if (state.staffMgmt.items[i].id === updated.id) state.staffMgmt.items[i] = updated;
          render();
        } catch (e) { msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message)); }
      }
      var roleSel = h("select", { onchange: function (e) { patch({ role: e.target.value }); } },
        STAFF_ROLES.map(function (r) { return h("option", { value: r, selected: r === s.role ? "selected" : null }, r); }));
      var toggleBtn = s.status === "ACTIVE"
        ? h("button", { class: "btn btn-sm btn-danger", onclick: function () { patch({ status: "DISABLED" }); } }, "Disable")
        : h("button", { class: "btn btn-sm", onclick: function () { patch({ status: "ACTIVE" }); } }, "Enable");
      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row" }, h("span", { class: "mono", style: "font-weight:700" }, s.email),
              isSelf ? h("span", { class: "muted", style: "font-size:12px" }, "(you)") : null),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, s.name, "  ·  last login ", fmtDate(s.lastLoginAt))),
          h("div", { class: "row", style: "gap:8px;align-items:center" },
            pill(s.role, ROLE_PILL[s.role] || "neutral"),
            pill(s.status, STAFF_STATUS_PILL[s.status] || "neutral"))),
        h("div", { class: "row", style: "gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap" },
          h("label", { class: "field", style: "flex:0 0 170px;margin:0" }, h("span", null, "Role"), roleSel),
          toggleBtn),
        msg);
    }

    // ── Campaigns (OPERATIONS) ──────────────────────────────────────────────
    function openCampaignForm(mode, campaign) { campaignForm = { mode: mode, campaign: campaign || null }; render(); }
    function closeCampaignForm() { campaignForm = null; render(); }

    function payoutText(c) {
      var t = c.payoutPercent + "% back";
      if (c.payoutCapPaise != null) t += " · up to " + rupees(c.payoutCapPaise);
      return t;
    }

    function CampaignsScreen() {
      var FILTERS = [["ALL", "All"], ["DRAFT", "Draft"], ["ACTIVE", "Live"], ["PAUSED", "Paused"], ["ENDED", "Ended"]];
      var chips = h("div", { class: "row", style: "gap:6px;flex-wrap:wrap" }, FILTERS.map(function (f) {
        var active = state.campaigns.filter === f[0];
        return h("button", { class: "btn btn-sm" + (active ? " btn-primary" : ""), onclick: function () {
          if (state.campaigns.filter === f[0]) return;
          state.campaigns.filter = f[0]; state.campaigns.items = null; loadCampaigns();
        } }, f[1]);
      }));

      var body;
      if (state.campaigns.loading && !state.campaigns.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (state.campaigns.error) body = h("div", { class: "flash flash-err" }, state.campaigns.error);
      else if (!state.campaigns.items || state.campaigns.items.length === 0) body = h("div", { class: "empty" }, "No campaigns in this view.");
      else body = h("div", null, state.campaigns.items.map(CampaignCard));

      return h("div", null,
        h("div", { class: "row", style: "justify-content:space-between;margin-bottom:12px" },
          h("h2", { style: "margin:0;font-size:18px" }, "Campaigns",
            state.campaigns.items ? h("span", { class: "muted", style: "font-weight:500;font-size:14px" }, "  " + state.campaigns.items.length) : null),
          h("div", { class: "row", style: "gap:8px" },
            campaignForm ? null : h("button", { class: "btn btn-sm btn-primary", onclick: function () { openCampaignForm("create", null); } }, "+ New campaign"),
            h("button", { class: "btn btn-sm", onclick: function () { loadCampaigns(); } }, "Refresh"))),
        campaignForm ? CampaignForm(campaignForm.mode, campaignForm.campaign) : null,
        h("div", { style: "margin-bottom:14px" }, chips),
        body);
    }

    // One campaign row: identity + the money/policy summary, plus the lifecycle
    // actions its status allows (DRAFT → publish/edit/end, ACTIVE → pause/end,
    // PAUSED → resume/edit/end; ENDED is terminal). Edit reopens the form.
    function CampaignCard(c) {
      var msg = h("div");
      var busy = false;
      async function act(verb) {
        if (busy) return; busy = true; msg.textContent = "";

    function isoDay(d) { return d.toISOString().slice(0, 10); }

    async function downloadReport() {

      try {
        var res = await fetch(API_BASE + "/admin/reports/" + r.type + q, { headers: { Authorization: "Bearer " + state.token } });
        if (res.status === 401) { logout("Your session expired — please sign in again."); return; }
        if (!res.ok) throw new Error("Download failed (" + res.status + ")");
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        var cd = res.headers.get("content-disposition") || "";
        var m = /filename="?([^"]+)"?/.exec(cd);

    // Dependency-free inline-SVG vertical bar chart (panel is CSP-tight → no CDN).
    function svgBarChart(bars, opts) {
      opts = opts || {};
      if (!bars.length) return h("div", { class: "empty" }, "No data in range.");
      var W = 680, H = opts.height || 168, padL = 40, padR = 8, padT = 12, padB = 32;
      var innerW = W - padL - padR, innerH = H - padT - padB;
      var max = Math.max.apply(null, bars.map(function (b) { return b.value; }).concat([1]));
      var n = bars.length, slot = innerW / n, bw = Math.max(2, Math.min(40, slot * 0.66));
      var color = opts.color || "var(--accent)";
      var every = Math.ceil(n / 12);
      var fmt = opts.money ? inrShort : function (v) { return String(v); };
      var els = [s("line", { x1: padL, y1: padT + innerH, x2: W - padR, y2: padT + innerH, stroke: "var(--border)" })];
      els.push(s("text", { x: 4, y: padT + 7, "font-size": "9", fill: "var(--muted)" }, fmt(max)));
      bars.forEach(function (b, i) {
        var bh = max > 0 ? (b.value / max) * innerH : 0;
        var x = padL + i * slot + (slot - bw) / 2, y = padT + innerH - bh;
        els.push(s("rect", { x: x, y: y, width: bw, height: Math.max(0, bh), rx: 2, fill: color },
          s("title", { text: (b.title || b.label) + ": " + fmt(b.value) })));

        if (i % every === 0) els.push(s("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", "font-size": "9", fill: "var(--muted)" }, b.label));
      });
      return s("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: String(H), style: "display:block;max-width:100%" }, els);
    }

        style: "width:88px", "aria-label": "How many units"
      });
      var reasonIn = h("input", {
        type: "text", maxlength: "500",
        placeholder: "What did you see? e.g. order page shows one unit",
        "aria-label": "Why this count"
      });
      var previewLine = h("div", { class: "muted", style: "font-size:12.5px;margin-top:6px" });
      var msg = h("div");
      var btn = h("button", { class: "btn btn-sm btn-primary", type: "submit" },
        already ? "Save correction" : "Confirm count");

      // The reason is REQUIRED and has no default. An audit row that says nothing
      // is worse than none, because it looks like diligence.
      function syncBtn() {
        var okReason = reasonIn.value.trim().length >= 3;
        btn.disabled = !okReason || a.busy === it.taskId;
        btn.title = okReason ? "" : "Say what you saw before saving";
      }
      reasonIn.oninput = syncBtn;

      var timer = null, seq = 0;
      function refreshPreview() {
        var q = parseInt(qtyIn.value, 10);
        if (!(q >= 1 && q <= 100)) {
          previewLine.textContent = "Enter a whole number of units, 1 to 100.";
          return;
        }
        previewLine.textContent = "Working out what this pays…";
        var mine = ++seq;
        // THE SAME ONE ROUTE as everything else. The panel deliberately does not
        // multiply the amount by the percentage itself: three money defects so far
        // have come from a second route to one number, and a preview that
        // disagreed with the action would be the fourth.
        api("GET", "/admin/tasks/" + it.taskId + "/quantity-preview?quantity=" + q)
          .then(function (p) {
            if (mine !== seq) return; // a later keystroke already won
            if (p.payable) {
              previewLine.textContent = "This pays " + rupees(p.refundPaise)
                + " — " + it.payoutPercent + "% of " + rupees(p.chargedPaise)
                + (it.payoutCapPaise != null ? ", capped at " + rupees(it.payoutCapPaise) : "");
            } else {
              previewLine.textContent = "This still would not pay: " + p.heldExplanation;
            }
          })
          .catch(function (e) {
            if (mine !== seq) return;
            previewLine.textContent = "Could not work out what this pays: " + e.message;
          });
      }
      qtyIn.oninput = function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(refreshPreview, 250);
      };
      refreshPreview();
      syncBtn();

      async function onSubmit(ev) {
        ev.preventDefault();
        var q = parseInt(qtyIn.value, 10);
        msg.textContent = "";
        if (!(q >= 1 && q <= 100)) {
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, "Enter a whole number of units, 1 to 100."));
          return;
        }
        if (reasonIn.value.trim().length < 3) {
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, "Say what you saw — this goes on the record for this payout."));
          return;
        }
        a.busy = it.taskId; a.actionError = null; btn.disabled = true;
        try {
          await api("POST", "/admin/tasks/" + it.taskId + "/quantity", {
            quantity: q, reason: reasonIn.value.trim()
          });
          a.busy = null;
          a.notice = "Saved. " + (already ? "Corrected to " : "Set to ") + q
            + (q === 1 ? " unit" : " units") + " on task " + it.taskId.slice(0, 8) + ".";
          await loadAmounts();
        } catch (e) {
          a.busy = null;
          msg.textContent = "";
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message));
          syncBtn();
        }
      }

      var facts = h("div", { class: "row", style: "gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px" },
        factCell("Order", h("span", { class: "mono" }, it.orderId || "—")),
        factCell("Amount on the line", rupees(it.itemPaise)),
        factCell("Order total", rupees(it.orderTotalPaise)),
        factCell("Ordered", fmtDay(it.orderDate)),
        factCell("Stage", it.state));

      var readerSaw = h("div", { style: "margin-top:10px" },
        h("div", { class: "nav-head", style: "padding:0 0 4px" }, "What the reader saw"),
        h("div", { style: "font-size:12.5px" },
          QTY_REASON_TEXT[it.quantityReason] || "No reading was recorded for this order."),
        it.quantityObserved != null
          ? h("div", { style: "font-size:12.5px;margin-top:4px" },
              h("strong", null, "The page stated " + it.quantityObserved
                + (it.quantityObserved === 1 ? " unit" : " units") + "."),
              " Check it before accepting it.")
          : null);

      var correction = already
        ? h("div", { class: "flash flash-err", style: "margin-top:10px;font-size:12.5px" },
            "A count of " + it.quantity + " is already on file. Saving a different number is a correction, and both numbers go on the record.")
        : null;

      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row", style: "gap:8px;align-items:center" },
              pill("held", "bad"),
              pill(it.platform, "info"),
              pill(it.state, "neutral")),
            h("div", { style: "margin-top:6px;font-weight:600" }, it.campaignTitle || "—"),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, it.productName || "")),
          h("div", { style: "text-align:right" },
            h("button", {
              class: "btn btn-sm btn-ghost",
              onclick: function () { loadUser(it.user.id, "amounts"); }
            }, "Open user →"),
            h("div", { class: "muted mono", style: "margin-top:6px;font-size:11.5px" },
              "task " + it.taskId.slice(0, 8)))),
        // The hold, in plain words, ABOVE the controls — so the reason to act and
        // the way to act are in one place.
        h("div", { class: "flash flash-info", style: "margin-top:10px;font-size:13px" }, it.heldExplanation),
        facts,
        readerSaw,
        correction,
        h("form", { onsubmit: onSubmit, style: "margin-top:12px" },
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end" },
            h("label", { class: "field", style: "flex:0 0 auto" }, h("span", null, "How many units"), qtyIn),
            h("label", { class: "field", style: "flex:1;min-width:220px" }, h("span", null, "Why — required"), reasonIn),
            btn),
          previewLine,
          msg));
    }

    // One labelled fact. Kept tiny and local so the card reads as a card.
    function factCell(label, value) {
      return h("div", null,
        h("div", { class: "nav-head", style: "padding:0 0 2px" }, label),
        h("div", null, value));
    }

    function AmountsScreen() {
      var a = state.amounts;
      var body;
      if (a.loading && !a.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");

          + "normal checks. Nothing here pays money by itself."),
