<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Fayr · Support Panel</title>
  <!-- Fayr's own three faces, the same families and weights the app loads in
       fayr-design.browser.jsx. display=swap on purpose: the panel is a working
       tool and must be readable in the fallback stack the moment it paints, not
       blank while a font downloads. Every rule below names a system fallback, so
       a blocked or slow CDN costs the look and never the legibility. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    /* ── Theme tokens ───────────────────────────────────────────────
       FAYR'S OWN PALETTE, read from fayr-design.browser.jsx. Nothing here was
       invented: every value is either a constant from that file's `C` block, or
       one of those constants darkened to carry small text, and each says which.

       ONE THEME, LIGHT. The prefers-color-scheme block that used to sit here is
       gone on purpose. Fayr's design system has no dark counterpart, so a dark
       mode could only ever be a half-converted guess at one — and a staff member
       on a dark-mode laptop was getting a different product from the one beside
       them. panel.test.mjs fails if it comes back.

       ── WHY FOUR OF THESE ARE DARKER THAN THE DESIGN FILE ───────────────

       MEASURED, not assumed. Fayr's published state colours are built for large
       bold type on a phone. As 11.5px pill text on these grounds not one of them
       reaches 4.5:1, and the worst is not close:

         greenDeep #30A90F   2.34:1        amber #F5A623   1.64:1
         red       #E5392B   3.04:1        refundInk #3E8E00   3.06:1

       So each keeps its HUE and SATURATION exactly and loses lightness until it
       clears 4.5:1 on the worst of the three grounds. That is the same move the
       design file already makes for itself — refundInk is a darkened green, and
       #A66A12 is a darkened amber — so it follows the system rather than leaving
       it. purple and sub already cleared and are untouched.

       WHAT THIS COSTS: pure #30A90F appears nowhere below. Every green surface in
       this panel carries text, and at these sizes it cannot. It is waiting for the
       layout step, where a large fill with no words on it can hold it properly. */
    :root {
      /* Grounds. */
      --bg: #F9FAE9;          /* C.cream */
      --surface: #FFFFFF;     /* C.white */
      --surface-2: #F1F2D9;   /* C.creamDeep */
      --border: #ECEDDC;      /* C.line */

      /* Ink. */
      --text: #191919;        /* C.ink */
      --muted: #5C5C5C;       /* C.sub — 6.33:1 on cream, untouched */

      /* Brand chrome: links, the active section, the primary button. */
      --accent: #1F6E0A;      /* C.greenDeep darkened — 4.52:1 at its worst use */
      --accent-fg: #FFFFFF;   /* on --accent: 6.38:1 */
      --yellow: #FFE000;      /* C.yellow */
      --yellow-deep: #F5C400; /* C.yellowDeep — the wordmark's full stop */

      /* State. Semantic, never decorative, and never the brand's job.
         --ok and --accent are the same green today because Fayr has one green and
         it has two jobs. They stay two tokens so moving one cannot move the other
         by accident. */
      --ok: #1F6E0A;          /* C.greenDeep darkened — 4.52:1 */
      --warn: #855506;        /* C.amber darkened — 4.53:1 */
      --bad: #B52216;         /* C.red darkened — 4.52:1 */
      --info: #7926D9;        /* C.purple — 4.68:1, untouched */
      --neutral: #5C5C5C;     /* C.sub — 4.80:1, untouched */

      /* A real shadow. The old one was two near-black films at 5% and 6% on a
         grey ground, which on cream is invisible. This is warm rather than grey,
         so a card lifts off the cream instead of smudging it. */
      --shadow: 0 1px 2px rgba(25,25,20,.05), 0 10px 28px rgba(25,25,20,.08);

      /* Softer surfaces. Named so a future screen cannot pick a sixth radius. */
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 8px;

      /* Fayr's three faces, each with the system stack behind it. */
      --mono: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace;
      --sans: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --display: 'Poppins', 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --logo: 'Alexandria', 'Poppins', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mono { font-family: var(--mono); }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }

    /* ── Buttons / inputs ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); border-radius: var(--radius-sm); padding: 9px 15px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .12s, border-color .12s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.06); background: var(--accent); }
    .btn-sm { padding: 5px 11px; font-size: 13px; border-radius: var(--radius-xs); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
    .btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
    input[type=text], input[type=email], input[type=password], textarea {
      width: 100%; font-family: inherit; font-size: 14px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    label.field { display: block; margin-bottom: 12px; }
    label.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }

    /* ── Pills ────────────────────────────────────────────────────────────── */
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
    .pill-ok      { color: var(--ok);      background: color-mix(in srgb, var(--ok) 15%, transparent); }
    .pill-warn    { color: var(--warn);    background: color-mix(in srgb, var(--warn) 16%, transparent); }
    .pill-bad     { color: var(--bad);     background: color-mix(in srgb, var(--bad) 15%, transparent); }
    .pill-info    { color: var(--info);    background: color-mix(in srgb, var(--info) 15%, transparent); }
    .pill-neutral { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 16%, transparent); }

    /* ── Console layout ───────────────────────────────────────────────────────
       A fixed sidebar and a scrolling work pane. The sidebar never scrolls with
       the content: an operator working a queue should always be able to see what
       else is waiting.                                                        */
    .shell { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      flex: 0 0 232px; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 16px 12px 12px; overflow-y: auto;
    }
    /* THE WORDMARK, as fayr-design.browser.jsx draws it: Alexandria 800, tight
       letter-spacing, ink, and the full stop in yellow.

       The dot is scoped to the sidebar. The login card reuses .brand for a second,
       different lockup ("Fayr · Support") whose dot is a separator rather than the
       wordmark's stop, and a yellow middot there would be a decoration nobody can
       read. The two lockups disagreeing is older than this change and is a layout
       question, so this step makes the sidebar right and leaves the other alone. */
    .brand {
      font-family: var(--logo); font-weight: 800; letter-spacing: -.04em;
      font-size: 21px; padding: 2px 10px 18px; color: var(--text); line-height: 1;
    }
    .sidebar .brand .dot { color: var(--yellow-deep); }
    .login-card .brand .dot { color: var(--accent); }
    .brand-sub {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-left: 7px; vertical-align: 3px;
    }
    /* Two levels: the team you are in, then its sections. A collapsed team is one
       line, so the whole console is four lines plus wherever you are working — the
       nine-flat-item list gave every role eight things it could not use. */
    .sidebar nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .nav-group { margin-bottom: 2px; }
    .team {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
      font-weight: 650; color: var(--text); line-height: 1.3;
      font-size: 13.5px; letter-spacing: -.005em;
    }
    .team:hover { background: var(--surface-2); }
    .team.open { color: var(--accent); }
    .team-glyph {
      width: 22px; height: 22px; flex: 0 0 22px; border-radius: 6px;
      display: grid; place-items: center; font-size: 12px;
      background: var(--surface-2); color: var(--muted);
    }
    .team.open .team-glyph { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .team-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-count {
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--muted); background: var(--surface-2);
      border-radius: 999px; padding: 1px 7px;
    }
    .team.open .team-count { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    /* The sections sit under a hairline rail, so which team they belong to is
       structural rather than something you have to remember. */
    .team-sections {
      margin: 2px 0 8px 21px; padding-left: 11px;
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 1px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; border-radius: var(--radius-xs); cursor: pointer;
      font-weight: 550; font-size: 13px; color: var(--muted); line-height: 1.3;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 650; }
    .nav-glyph { width: 15px; text-align: center; font-size: 12px; opacity: .8; }
    .nav-label { flex: 1; min-width: 0; }
    .nav-badge {
      background: var(--accent); color: var(--accent-fg);
      border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .nav-item.active .nav-badge { background: var(--accent); color: var(--accent-fg); }
    .sidebar-foot { border-top: 1px solid var(--border); padding-top: 10px; }
    .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .who-avatar {
      flex: 0 0 30px; height: 30px; border-radius: 999px;
      background: var(--surface-2); color: var(--text);
      display: grid; place-items: center; font-size: 11.5px; font-weight: 700;
    }
    .who .email {
      font-weight: 600; font-size: 12.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .role-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .07em;
      color: var(--muted); text-transform: uppercase;
    }

    .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    header.top {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 16px 28px 15px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .top-crumb {
      font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 3px;
    }
    .top-title { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
    .top-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; max-width: 68ch; }
    .spacer { flex: 1; }
    .quickfind {
      width: 260px; padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 13px;
    }
    .quickfind:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    main { flex: 1; overflow-y: auto; max-width: 1100px; width: 100%; padding: 26px 30px 96px; }

    @media (max-width: 860px) {
      .shell { flex-direction: column; height: auto; overflow: visible; }
      .sidebar { flex: 0 0 auto; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar nav { display: flex; gap: 4px; flex-wrap: wrap; }
      .team-sections { margin-left: 0; border-left: none; padding-left: 0; }
      .pane { overflow: visible; }
      .quickfind { width: 160px; }
    }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 20px; }
    .card > h3 { margin: 0 0 14px; font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }

    /* One finding: a severity, a plain sentence, and what it does to a user. The
       left rail keeps several findings on one offer readable as a list. */
    .finding { border-left: 2px solid var(--border); padding: 6px 0 6px 11px; margin-top: 8px; }
    .finding:first-child { margin-top: 0; }
    .stat { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat-bad { color: var(--bad); }
    .stat-warn { color: var(--warn); }
    .stat-ok { color: var(--ok); }
    .stat-neutral { color: var(--muted); }
    /* A row of headline numbers. Wraps by itself, so it is readable on a phone
       without needing a width rule to remember it — the columns are a minimum
       size and the browser fits as many as it can. */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-bottom: 20px;
    }
    .group-list { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 12.5px; }
    .group-list li { margin-bottom: 2px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .kv .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .kv .v { font-size: 15px; font-weight: 600; margin-top: 2px; }

    table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.ledger th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    table.ledger td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.ledger tr:last-child td { border-bottom: none; }
    .amt-pos { color: var(--ok); }
    .amt-neg { color: var(--bad); }
    .table-wrap { overflow-x: auto; }

    .task { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface-2); }
    .task:last-child { margin-bottom: 0; }
    .task .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .task .title { font-weight: 700; }
    .task .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }

    /* ── One person, as a dashboard ─────────────────────────────────────────
       Two columns: the offers, which are what people ring about, and a narrow
       rail of ledgers beside them. Roughly 2:1, and ONE column under 900px —
       a side rail on a narrow screen becomes a footer nobody scrolls to. */
    .userpage { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 900px) { .userpage { grid-template-columns: minmax(0, 1fr); } }
    .col-head { margin: 0 0 10px; font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }

    /* Who they are. The large line is the name when there is one and the mobile
       when there is not — never a blank space and never a placeholder. */
    .ident { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
    .ident .who-name { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; word-break: break-word; }
    .ident .who-mobile { font-size: 15px; font-weight: 600; margin-top: 3px; }
    .ident .no-name { color: var(--muted); font-style: italic; font-size: 13.5px; margin-top: 4px; }
    .ident .who-under { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 8px; }

    /* One offer, whole. The strip is six real states, so every step draws its
       own word AND what it says about itself — colour is never the only signal. */
    .offer .offer-title { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .journey { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 12px 0 10px; }
    .jstep { min-width: 0; }
    .jbar { height: 5px; border-radius: 999px; background: var(--border); }
    .jword { font-size: 11px; margin-top: 5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .jmark { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
    .jstep.done .jbar { background: var(--ok); }
    .jstep.done .jword, .jstep.done .jmark { color: var(--ok); }
    .jstep.current .jbar { background: var(--warn); }
    .jstep.current .jword { color: var(--warn); font-weight: 700; }
    .jstep.current .jmark { color: var(--warn); font-weight: 600; }

    .thread { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--surface-2); }
    .thread:last-child { margin-bottom: 0; }
    .thread .subj { font-family: var(--display); font-weight: 700; font-size: 15px; }
    .thread .op { margin: 8px 0 12px; white-space: pre-wrap; }
    .reply { border-left: 3px solid var(--border); padding: 4px 0 4px 12px; margin: 8px 0; white-space: pre-wrap; }
    .reply.staff { border-left-color: var(--accent); }
    .reply .by { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .reply.staff .by { color: var(--accent); }
    .composer { margin-top: 12px; }
    .composer .row { justify-content: flex-end; margin-top: 8px; }

    .flash { padding: 11px 15px; border-radius: var(--radius-sm); margin-bottom: 16px; font-weight: 500; }
    .flash-err { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
    .flash-info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); border: 1px solid color-mix(in srgb, var(--info) 28%, transparent); }
    /* Used when something is worth saying but is not a refusal — the reply that
       does not read the way Fayr writes still goes, and this says so. */
    .flash-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
    .empty { color: var(--muted); font-style: italic; padding: 6px 0; }

    /* ── Login ────────────────────────────────────────────────────────────── */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card .brand { font-size: 22px; margin-bottom: 4px; }
    .login-card .sub { color: var(--muted); margin-bottom: 20px; }
    .apibase { font-size: 12px; color: var(--muted); margin-top: 16px; word-break: break-all; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (function () {
    "use strict";

    // ── API base resolution ────────────────────────────────────────────────
    // Priority: ?api= override → saved override → same-origin (served through a
    // proxy/tunnel on a standard port) → same host on :3000 (local static serve).
    function resolveApiBase() {
      var p = new URLSearchParams(location.search);
      var q = p.get("api");
      if (q) return q.replace(/\/$/, "");
      var saved = sessionStorage.getItem("fayr_admin_apibase");
      if (saved) return saved;
      if (location.protocol === "file:") return "http://localhost:3000";
      var port = location.port;
      if (!port || port === "80" || port === "443") return location.origin;
      return location.protocol + "//" + location.hostname + ":3000";
    }
    var API_BASE = resolveApiBase();

    // ── Session state ───────────────────────────────────────────────────────
    var SS = "fayr_admin_";
    var state = {
      token: sessionStorage.getItem(SS + "token") || null,
      staff: JSON.parse(sessionStorage.getItem(SS + "staff") || "null"),
      view: "login",       // login | app
      screen: "withdrawals", // withdrawals | queue | search | staff | user
      flash: null,
      withdrawals: { loading: false, error: null, items: null, filter: "REQUESTED" },
      queue: { loading: false, error: null, items: null },
      // What people asked the assistant. `stats` is the how-long-it-takes strip.
      chat: {
        loading: false, error: null, items: null, total: 0, stats: null,
        filter: "UNRESOLVED", busy: null, notice: null, actionError: null

        a.error = e.message;
      } finally {
        a.loading = false; render();
      }
    }

    function setActivityWindow(days) {
      state.user.activity.days = days;
      state.user.activity.data = null;
      loadActivity();
    }

    /** The clock time on a row. Date lives in the heading above it. */
    function fmtTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
    }

    /** A count with Indian grouping, so 1342 reads 1,342. */
    function fmtCount(n) {
      return Number(n).toLocaleString("en-IN");
    }

    /**
     * A COUNT AND ITS NOUN, AGREEING WITH EACH OTHER.
     *
     * "1 offers joined" was on the screen. Nothing was wrong with the number,
     * and that is the point: a sentence that does not agree with itself makes a
     * person wonder what else on the page was written by something that is not
     * reading what it says.
     *
     * NOUGHT TAKES THE PLURAL, because that is what English does — no screens,
     * not no screen. Only exactly one is singular.
     *
     * BOTH FORMS ARE PASSED IN rather than an "s" being added here. English does
     * not make its plurals that way often enough to guess: "entry" and "entries"
     * are one of the two places this is used on the very first day.
     *
     * It sits beside fmtCount because that is where the counts are written. If a
     * second screen needs it, it moves up to the formatting helpers with the
     * rest and nothing else changes.
     */
    function plural(n, one, many) {
      return fmtCount(n) + " " + (Number(n) === 1 ? one : many);
    }

    /**
     * ENTRIES INTO DAYS, IN THE ORDER THEY ARRIVED.
     *
     * The heading IS the grouping key: two entries land under one heading exactly
     * when they format to the same date. Deriving the key any other way would let
     * the heading and the grouping drift, which shows up as one date printed twice
     * with a gap between them.
     *
     * No sorting. The server already decided the order and it is total; this walks
     * it once and cuts it where the day changes.
     */
    function activityByDay(entries) {
      var days = [];
      var seen = {};
      (entries || []).forEach(function (e) {
        var key = fmtDay(e.at);
        if (!Object.prototype.hasOwnProperty.call(seen, key)) {
          seen[key] = { day: key, entries: [] };
          days.push(seen[key]);
        }
        seen[key].entries.push(e);
      });
      return days;
    }

    /** Where setup got to, in words. Never a field name and never a bare number. */
    function activitySetupLine(summary) {
      if (summary.setupFinished) return "Finished setting up.";
      if (summary.setupStoppedAt == null) {
        return "Setup was never marked finished, though every step was done.";
      }
      return "Stopped at setup step " + String(summary.setupStoppedAt)
        + " of " + String(ACTIVITY_SETUP_STEPS) + ".";
    }

    /** How long since we last saw them, as a person would say it. */
    function activityQuietLine(summary) {
      var days = summary.daysQuiet;
      if (days == null) return "Never seen.";
      if (days === 0) return "Seen today.";
      if (days === 1) return "Quiet for a day.";
      return "Quiet for " + fmtCount(days) + " days.";
    }

    /**
     * THE TRIM MESSAGE. Both numbers, always, or none.
     *
     * "Showing 500" on its own reads as "there were 500". The count without the
     * total is the lie this sentence exists to prevent, so the two are built in one
     * string and there is no branch that can produce one without the other.
     */
    function activityTrimLine(timeline) {
      if (!timeline || !(timeline.trimmed > 0)) return null;
      return "Showing " + fmtCount(timeline.shown) + " of " + fmtCount(timeline.total)
        + " — narrow the window to see more.";
    }

    /** What an empty trail says. A sentence, never a blank box. */
    function activityEmptyLine(days) {
      if (days === 365) {
        return "Nothing recorded for this person in the last year.";
      }
      return "Nothing recorded for this person in the last " + String(days)
        + " days. Try a longer window.";
    }

    // ONE CARD HOLDING ALL OF THIS USED TO SIT HERE, and it is gone rather than
    // left behind. Its four parts were pulled apart by the user page above: the
    // window picker and the summary moved to the top of that page, and the
    // timeline is now drawn twice — once per offer, and once for everything that
    // belongs to no offer. A spare render function nobody calls is how a screen
    // comes back by accident.

    function ActivityWindowPicker() {
      return h("div", { class: "row", style: "margin-bottom:12px" },
        h("span", { class: "muted" }, "Looking back"),
        ACTIVITY_WINDOWS.map(function (w) {
          return h("button", {
            class: "btn btn-sm" + (state.user.activity.days === w[0] ? " btn-primary" : ""),
            onClick: function () { setActivityWindow(w[0]); },
          }, w[1]);
        }));
    }

    // One readable line each, because a support agent reads this while somebody is
    // waiting on the phone. The window moves the timeline underneath; these numbers
    // are about the PERSON and do not move with it, which is what the note says.
    function ActivitySummary(s) {
      return h("div", { style: "margin-bottom:14px" },
        h("div", null, "First seen ", fmtDay(s.firstSeen),
          ", last seen ", fmtDay(s.lastSeen), ". ", activityQuietLine(s)),
        h("div", { style: "margin-top:4px" },
          plural(s.totalScreens, "screen", "screens"), " opened, ",
          plural(s.totalTasks, "offer", "offers"), " joined."),
        h("div", { style: "margin-top:4px" }, activitySetupLine(s)),
        h("div", { class: "muted", style: "margin-top:6px;font-size:12.5px" },
          "These three lines count everything ever recorded about this person. "
          + "Only the list below moves with the window."));
    }

    function ActivityTimeline(d) {
      if (d.timeline.entries.length === 0) {
        return h("div", { class: "empty" }, activityEmptyLine(d.window.days));
      }
      var trim = activityTrimLine(d.timeline);
      return h("div", null,
        activityByDay(d.timeline.entries).map(function (group) {
          return h("div", { style: "margin-top:14px" },
            h("div", {
              style: "font-weight:700;font-size:12.5px;text-transform:uppercase;"
                + "letter-spacing:.06em;color:var(--muted);"
                + "border-bottom:1px solid var(--border);padding-bottom:5px",
            }, group.day),
            group.entries.map(ActivityRow));
        }),
        trim
          ? h("div", { class: "muted", style: "margin-top:14px;font-size:13px" }, trim)
          : null);
    }

    function ActivityRow(e) {
      // An unknown kind still draws, in the neutral tone and under its own name.
      // A row that vanished because the server grew a kind would be a gap in a
      // trail, and a gap in a trail is invisible.
      var k = ACTIVITY_KIND[e.kind] || { word: e.kind, tone: "var(--neutral)" };
      return h("div", { style: "display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)" },
        h("div", {
          class: "num muted",
          style: "min-width:52px;font-size:12.5px;padding-top:1px;white-space:nowrap",
        }, fmtTime(e.at)),
        h("div", {
          style: "min-width:82px;font-size:12px;font-weight:700;padding-top:1px;"
            + "text-transform:uppercase;letter-spacing:.04em;color:" + k.tone,
        }, k.word),
        h("div", { style: "min-width:0" },
          h("div", null, e.what),
          e.detail
            ? h("div", { class: "muted", style: "font-size:12.5px;margin-top:2px" }, e.detail)
            : null));
    }
    // ── one person's trail: end ───────────────────────────────────────────────

    // Replace a question in whatever list currently holds it, then re-render.
    function replaceQuestion(updated) {
      if (state.queue.items) {
        for (var i = 0; i < state.queue.items.length; i++)
          if (state.queue.items[i].id === updated.id) state.queue.items[i] = updated;
      }
      if (state.user.data && state.user.data.questions) {
        for (var j = 0; j < state.user.data.questions.length; j++)
          if (state.user.data.questions[j].id === updated.id) state.user.data.questions[j] = updated;
      }
      render();
    }

    // Merge an action result back into the withdrawals list. The approve/reject/
    // mark-paid responses omit the user + payoutMethod context the list row shows,
    // so we merge onto the existing row rather than replacing it wholesale.
    function replaceWithdrawal(updated) {
      if (state.withdrawals.items) {
        for (var i = 0; i < state.withdrawals.items.length; i++)
          if (state.withdrawals.items[i].id === updated.id)
            state.withdrawals.items[i] = Object.assign({}, state.withdrawals.items[i], updated);
      }
      render();
    }

    // ── Views ─────────────────────────────────────────────────────────────────
    function LoginView() {
      var emailIn = h("input", { type: "email", autocomplete: "username", placeholder: "you@fayr.app", value: "" });

    // ── Console shell ───────────────────────────────────────────────────────
    // The navigation is GROUPED rather than a flat strip, because the seven areas
    // are not peers: three are work queues someone is expected to clear, two are
    // things you maintain, two are things you look at. A queue with items waiting
    // carries a count, so an operator can see where the work is without opening
    // each one.
    // ── The four teams who actually use this ──────────────────────────────────
    //
    // The nine sections used to sit in three headings named after what they were
    // — Queues, Catalogue, Insight — which meant nobody's own work was in one
    // place. They are grouped by the TEAM THAT OWNS THEM instead, so a finance
    // person opens the panel and sees finance, and the other seven sections are
    // one level away rather than mixed in.
    //
    // Front-end operations owns what is live and visible in the app: the offers,
    // their pictures, their words. That is why the nightly offer check lands in
    // their tab and not in Operations'.
    //
    // FOUR TEAMS, NOT FOUR ROLES. The server's roles are still SUPPORT, FINANCE,
    // OPERATIONS and ADMIN, and a team here can be visible to more than one of
    // them — Front-end operations is permitted as OPERATIONS today. Naming a team
    // the panel cannot enforce would be claiming a separation that does not exist,
    // so the role tag under the name is the truth about what someone can reach.
    //
    // Shape: [key, team name, glyph, [[section id, label, glyph], ...]]
    var TEAMS = [
      // FIRST, ON PURPOSE. It is the answer to the one question a director always
      // asks, and it belongs to no single team: everybody who runs Fayr needs it.
      ["everyone", "Everyone", "◎", [
        ["running", "How Fayr is running", "◎"],
        ["growth", "Signing up", "↗"],
      ]],
      ["finance", "Finance", "₹", [
        ["withdrawals", "Withdrawals", "↗"],
        ["reports", "Reports", "◱"],
      ]],
      ["support", "Customer support", "☎", [
        ["queue", "Questions", "✉"],
        ["chats", "Conversations", "💬"],
        ["chat", "Chat questions", "❓"],
        ["answers", "Answer book", "📖"],
        ["verifications", "Screenshots", "▣"],
        ["reviews", "Review checks", "★"],
      ]],
      ["operations", "Operations", "⚙", [
        ["amounts", "Unit counts", "#"],
        ["staff", "Staff accounts", "◍"],
        ["search", "Find a user", "⌕"],
      ]],
      ["fops", "Front-end operations", "◈", [
        ["offers", "Offer check", "!"],
        ["livepages", "Live pages", "🔍"],
        ["campaigns", "Campaigns", "◈"],
      ]],
    ];

    /** Which team a section belongs to, or null. */
    function teamOf(screenId) {
      var id = screenId === "user" ? (state.user && state.user.from) || "search" : screenId;
      for (var i = 0; i < TEAMS.length; i++) {
        var sections = TEAMS[i][3];
        for (var j = 0; j < sections.length; j++) if (sections[j][0] === id) return TEAMS[i];
      }
      return null;
    }

    /** Sections of a team this role may see. */
    function visibleSections(team) {
      return team[3].filter(function (d) { return roleCanSee(d[0]); });
    }

    // How many items are waiting in each queue. Null until that queue has been
    // loaded once — a badge showing 0 when nothing has been counted would be a
    // claim we cannot make.
    function pendingCount(id) {
      if (id === "withdrawals") {
        if (!state.withdrawals.items) return null;
        return state.withdrawals.items.filter(function (w) { return w.status === "REQUESTED"; }).length;
      }
      if (id === "queue") {
        if (!state.queue.items) return null;
        return state.queue.items.filter(function (q) { return q.status !== "CLOSED"; }).length;
      }
      if (id === "verifications") {
        if (!state.verifications.items) return null;
        return state.verifications.total != null
          ? state.verifications.total
          : state.verifications.items.length;
      }
      if (id === "amounts") {
        if (!state.amounts.items) return null;
        return state.amounts.total != null ? state.amounts.total : state.amounts.items.length;
      }
      if (id === "reviews") {
        if (!state.reviews.items) return null;
        // Already-confirmed cards stay on screen so a mistake can be undone, but
        // they are not WORK — counting them would send someone looking for a job
        // that is already done.
        return state.reviews.items.filter(function (it) { return !it.confirmedVisible; }).length;
      }
      return null;
    }

    function Sidebar() {
      var here = teamOf(state.screen);
      var groups = TEAMS.map(function (team) {
        var sections = visibleSections(team);
        if (!sections.length) return null; // a role that owns nothing here sees no team

        var open = here === team;
        var waiting = sections.reduce(function (n, d) {
          var c = pendingCount(d[0]);
          return n + (c || 0);
        }, 0);

        // The team itself is the click target. Landing on its first section is the
        // right default: every team has one section it lives in, and making people
        // choose twice to get anywhere is the friction this grouping removes.
        var head = h("div", {
          class: "team" + (open ? " open" : ""),
          role: "button", tabindex: "0",
          "aria-expanded": open ? "true" : "false",
          onclick: function () { switchTab(sections[0][0]); },
          onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchTab(sections[0][0]); } }
        },
          h("span", { class: "team-glyph" }, team[2]),
          h("span", { class: "team-label" }, team[1]),
          waiting ? h("span", { class: "team-count" }, String(waiting)) : null);

        // Sections show for the team you are in. Collapsed teams stay one line, so
        // the whole console is four lines when you are not using it.
        var list = open ? h("div", { class: "team-sections" }, sections.map(function (d) {
          var id = d[0], count = pendingCount(id);
          return h("div", {
            class: "nav-item" + (state.screen === id ? " active" : ""),
            role: "button", tabindex: "0",
            onclick: function () { switchTab(id); },
            onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchTab(id); } }
          },
            h("span", { class: "nav-glyph" }, d[2]),
            h("span", { class: "nav-label" }, d[1]),
            count ? h("span", { class: "nav-badge" }, String(count)) : null);
        })) : null;

        return h("div", { class: "nav-group" }, head, list);
      }).filter(Boolean);

      return h("aside", { class: "sidebar" },
        h("div", { class: "brand" }, "fayr", h("span", { class: "dot" }, "."), h("span", { class: "brand-sub" }, "ops")),
        h("nav", null, groups),
        h("div", { class: "sidebar-foot" },
          h("div", { class: "who" },
            h("div", { class: "who-avatar" }, initialsOf(state.staff)),
            h("div", { style: "min-width:0" },
              h("div", { class: "email", title: state.staff ? state.staff.email : "" }, state.staff ? state.staff.email : ""),
              h("div", { class: "role-tag" }, state.staff ? state.staff.role : ""))),
          h("button", { class: "btn btn-sm btn-ghost", style: "width:100%;margin-top:8px", onclick: function () { logout(); } }, "Log out")));
    }

    function initialsOf(staff) {
      if (!staff) return "?";
      var src = staff.name || staff.email || "?";
      var parts = String(src).replace(/@.*/, "").split(/[.\s_-]+/).filter(Boolean);
      return ((parts[0] || "?")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
    }

      queue: ["Questions", "Users waiting on an answer. Oldest first."],

          render();

      }
      var roleSel = h("select", { onchange: function (e) { patch({ role: e.target.value }); } },
        STAFF_ROLES.map(function (r) { return h("option", { value: r, selected: r === s.role ? "selected" : null }, r); }));
      var toggleBtn = s.status === "ACTIVE"
        ? h("button", { class: "btn btn-sm btn-danger", onclick: function () { patch({ status: "DISABLED" }); } }, "Disable")
        : h("button", { class: "btn btn-sm", onclick: function () { patch({ status: "ACTIVE" }); } }, "Enable");
      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row" }, h("span", { class: "mono", style: "font-weight:700" }, s.email),
              isSelf ? h("span", { class: "muted", style: "font-size:12px" }, "(you)") : null),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, s.name, "  ·  last login ", fmtDate(s.lastLoginAt))),
          h("div", { class: "row", style: "gap:8px;align-items:center" },
            pill(s.role, ROLE_PILL[s.role] || "neutral"),
            pill(s.status, STAFF_STATUS_PILL[s.status] || "neutral"))),
        h("div", { class: "row", style: "gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap" },
          h("label", { class: "field", style: "flex:0 0 170px;margin:0" }, h("span", null, "Role"), roleSel),
          toggleBtn),
        msg);
    }

    // ── Campaigns (OPERATIONS) ──────────────────────────────────────────────
    function openCampaignForm(mode, campaign) { campaignForm = { mode: mode, campaign: campaign || null }; render(); }
    function closeCampaignForm() { campaignForm = null; render(); }

    function payoutText(c) {
      var t = c.payoutPercent + "% back";
      if (c.payoutCapPaise != null) t += " · up to " + rupees(c.payoutCapPaise);
      return t;
    }

    // ── The nightly offer check ───────────────────────────────────────────────
    //
    // Three sections, in this order, because that is the order they deserve
    // attention in:
    //
    //   1. OFFERS WITH SOMETHING WRONG. Short by design — anything that turns out
    //      to be on most of the catalogue is lifted into section 2 by the server,
    //      so this list stays the exceptions.
    //   2. ACROSS THE CATALOGUE. A problem on ten of thirteen offers is a decision
    //      about a policy, not ten things to fix one at a time.
    //   3. WHAT COULD NOT BE CHECKED. Said once, with the offers it applies to.
    //      Never a pass, and never silent — a check that quietly skips something is
    //      worse than one that says it skipped it.
    //
    // The panel makes no judgements of its own here. Every word, severity and count
    // comes from the server, so this tab and the nightly run can never disagree
    // about what a broken offer is.
    // ── assistant screens: begin ─────────────────────────────────────────────
    // Two screens for the customer support team: what people asked the assistant,
    // and the answers it is allowed to give. Sliced out by panel.test.mjs between
    // these two sentinel comments and rendered against realistic data, so a call
    // to a helper that does not exist fails a test instead of a demo.

    /** Whether an answer was written by a person or drafted by the assistant. */
    function answerOrigin(a) {
      if (a.origin === "STAFF") return { text: "Written by a person", tone: "ok" };
      if (a.origin === "ASSISTANT") return { text: "Drafted by the assistant", tone: "warn" };
      return { text: "Shipped with the app", tone: "neutral" };
    }

    /** The one thing somebody has to know before approving a drafted answer. */
    function approvalNote(a) {
      if (a.origin !== "ASSISTANT") return null;
      var lines = ["No person has read this yet. Read it before you approve it."];
      if (a.language !== "en") {
        lines.push("Nobody who speaks this language has checked the wording.");
      }
      return lines.join(" ");
    }

    // ── CONVERSATIONS ────────────────────────────────────────────────────────
    //
    // The half that was missing. Somebody could ask, and nobody at Fayr could
    // answer them.
    //
    // TAKING IS A SEPARATE ACT FROM REPLYING, on purpose. Two agents typing
    // different answers into one conversation, minutes apart, is worse than one
    // slow answer, and the shopper cannot tell which one is Fayr's. So the reply
    // box only appears once your name is on it, and the server refuses a reply
    // from anybody else even if this screen were wrong about that.

    function ConversationsScreen() {
      var st = state.chats;
      if (st.open) return OneConversation(st.open);

      var filters = h("div", { class: "row", style: "gap:8px;margin-bottom:14px" },
        [["WAITING_FOR_PERSON", "Waiting for a person"], ["TAKEN", "Taken"],
         ["ASSISTANT", "With the assistant"], ["CLOSED", "Closed"], ["", "All"]]
          .map(function (f) {
            return h("button", {
              class: "btn btn-sm" + (st.filter === f[0] ? " btn-primary" : ""),
              onclick: function () { setChatsFilter(f[0]); }
            }, f[1]);
          }));

      var body;
      if (st.loading && !st.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (st.error) body = h("div", { class: "flash flash-err" }, st.error);
      else if (!st.items || st.items.length === 0) body = h("div", { class: "empty" }, "No conversations here.");
      else body = h("div", null, st.items.map(ConversationCard));

      // Reading one person's history rather than the queue: say whose, and give
      // one way back to the queue.
      var whose = st.onlyUserId
        ? h("div", { class: "flash flash-info", style: "margin-bottom:12px" },
            h("div", null, "Every conversation from ", h("b", null, st.person || "this person"),
              ", newest first. Closed ones included."),
            h("button", {
              class: "btn btn-sm", style: "margin-top:8px",
              onclick: function () { setChatsFilter("WAITING_FOR_PERSON"); }
            }, "Back to the queue"))
        : null;

      return h("div", null,
        st.notice ? h("div", { class: "flash flash-info" }, st.notice) : null,
        st.actionError ? h("div", { class: "flash flash-err" }, st.actionError) : null,
        whose,
        st.onlyUserId ? null : filters,
        h("div", { class: "muted", style: "margin-bottom:10px" }, st.items ? st.total + " in all" : ""),
        body);
    }

    function conversationTone(state) {
      if (state === "WAITING_FOR_PERSON") return "bad";
      if (state === "TAKEN") return "warn";
      if (state === "CLOSED") return "neutral";
      return "ok";
    }

    function ConversationCard(c) {
      return h("div", { class: "card finding" },
        h("div", { class: "row", style: "justify-content:space-between;gap:10px" },
          h("div", { style: "min-width:0" },
            h("div", { style: "font-weight:700;font-size:15px" },
              c.latest ? c.latest.body : "Nothing said yet"),
            h("div", { class: "muted mono", style: "margin-top:4px" },
              c.user.displayId, "  ·  ", fmtDate(c.lastMessageAt),
              "  ·  ", String(c.messageCount) + " messages"),
            c.user
              ? h("button", {
                  class: "btn btn-sm", style: "margin-top:6px",
                  onclick: function () {
                    showEveryConversationFrom(c.user.id, c.user.displayId);
                  }
                }, "Every conversation from this person")
              : null),
          h("div", { class: "row", style: "gap:8px" },
            statePill(c.stateInWords, conversationTone(c.state)),
            h("button", {
              class: "btn btn-sm btn-primary",
              disabled: state.chats.busy === c.chatId,
              onclick: function () { openConversation(c.chatId); }
            }, state.chats.busy === c.chatId ? "Opening…" : "Open"))));
    }

    function OneConversation(chat) {
      var st = state.chats;
      var mine = state.staff && chat.takenBy && chat.takenBy.id === state.staff.id;
      var admin = state.staff && state.staff.role === "ADMIN";
      var canReply = !chat.closed && (mine || admin);

      var bubbles = chat.messages.length === 0
        ? [h("div", { class: "empty" }, "Nothing said yet.")]
        : chat.messages.map(function (m) {
            var theirs = m.author === "PERSON";
            // ONE BUTTON to turn a reply a person wrote into a new answer, so the
            // next person who asks the same thing is answered straight away. It
            // arrives as a draft: whoever wrote the words does not automatically
            // decide they are Fayr's official answer.
            var canSave = m.author === "AGENT" && canReply;
            var saving = st.savingFrom === m.id;
            return h("div", {
              class: "card",
              style: "margin-bottom:8px;max-width:80%;"
                + (theirs ? "" : "margin-left:auto;")
            },
              h("div", { class: "muted", style: "font-size:12px;margin-bottom:4px" },
                m.from, "  ·  ", fmtDate(m.sentAt)),
              h("div", null, m.body),
              canSave
                ? h("div", { class: "row", style: "gap:6px;margin-top:8px;align-items:center" },
                    h("input", {
                      class: "input", style: "max-width:150px",
                      placeholder: "What kind? e.g. refund",
                      value: st.saveTopic,
                      oninput: function (e) { state.chats.saveTopic = e.target.value; }
                    }),
                    h("button", {
                      class: "btn btn-sm",
                      disabled: saving,
                      onclick: function () { saveReplyAsAnswer(chat.chatId, m.id); }
                    }, saving ? "Saving…" : "Make this an answer"))
                : null);
          });

      // The plain-language rule applies to what an agent types too. It WARNS and
      // does not block: a reply to one person who is waiting is not worth holding
      // back over a word we would rather they had not used.
      var warnings = st.warnings && st.warnings.length
        ? h("div", { class: "flash flash-warn" },
            h("div", { style: "font-weight:700;margin-bottom:4px" },
              "This does not read the way Fayr writes. You can still send it."),
            h("ul", { style: "margin:0;padding-left:18px" },
              st.warnings.map(function (w) { return h("li", null, w); })))
        : null;

      // A SUGGESTED EMAIL, FOR THIS AGENT TO COPY.
      //
      // Fayr does not send email. There is no address to send from and nothing
      // here talks to a mail server: it is words, a box you can select, and a
      // copy button. The agent sends it from their own email.
      //
      // The box is always there even when the copy button works, because copying
      // to the clipboard is blocked on a plain web address — which is exactly how
      // the panel is reached from a phone on the wifi.
      var email = st.email
        ? h("div", { class: "card", style: "margin-top:14px" },
            h("div", { class: "row", style: "justify-content:space-between;gap:10px" },
              h("div", { style: "font-weight:700" }, "A suggested email"),
              statePill(
                st.email.fromTheAnswerBook ? "From the answer book" : "Nothing stored yet",
                st.email.fromTheAnswerBook ? "ok" : "warn")),
            h("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
              "Fayr does not send email. Copy this, change anything you like, and "
              + "send it from your own email."),
            st.email.plainLanguage && !st.email.plainLanguage.ok
              ? h("div", { class: "flash flash-warn", style: "margin-top:10px" },
                  h("div", { style: "font-weight:700;margin-bottom:4px" },
                    "This does not read the way Fayr writes. You can still send it."),
                  h("ul", { style: "margin:0;padding-left:18px" },
                    st.email.plainLanguage.problems.map(function (w) {
                      return h("li", null, w);
                    })))
              : null,
            h("div", { class: "mono", style: "margin-top:10px;font-size:12px" },
              "Subject: " + st.email.subject),
            h("textarea", {
              class: "input", rows: "12", style: "margin-top:8px",
              value: st.email.body,
              oninput: function (e) { state.chats.email.body = e.target.value; }
            }),
            h("div", { class: "row", style: "gap:8px;margin-top:10px" },
              h("button", {
                class: "btn btn-sm",
                onclick: function () { copyEmailDraft(); }
              }, "Copy it"),
              h("button", {
                class: "btn btn-sm",
                onclick: function () { state.chats.email = null; state.chats.emailNote = null; render(); }
              }, "Hide")),
            st.emailNote
              ? h("div", { class: "muted", style: "margin-top:8px;font-size:12px" }, st.emailNote)
              : null)
        : null;

      var box = canReply
        ? h("div", { class: "card", style: "margin-top:14px" },
            h("textarea", {
              class: "input", rows: "4", placeholder: "Type your reply",
              value: st.draft,
              oninput: function (e) { state.chats.draft = e.target.value; }
            }),
            h("div", { class: "row", style: "gap:8px;margin-top:10px" },
              h("button", {
                class: "btn btn-primary",
                disabled: st.busy === "reply",
                onclick: function () { sendChatReply(chat.chatId); }
              }, st.busy === "reply" ? "Sending…" : "Send"),
              h("button", {
                class: "btn btn-sm",
                disabled: st.busy === "check",
                onclick: function () { checkChatReply(); }
              }, "Check my words"),
              h("button", {
                class: "btn btn-sm",
                disabled: st.busy === "email",
                onclick: function () { loadEmailDraft(chat.chatId); }
              }, st.busy === "email" ? "Writing…" : "Suggest an email"),
              h("button", {
                class: "btn btn-sm",
                disabled: st.busy === "close",
                onclick: function () { closeConversation(chat.chatId); }
              }, st.busy === "close" ? "Closing…" : "Close this conversation")))
        : h("div", { class: "card", style: "margin-top:14px" },
            h("div", { class: "muted" },
              chat.closed
                ? "This conversation is closed. Nobody can add to it."
                : chat.takenBy
                  ? "Taken by " + chat.takenBy.name + ". Only they, or an administrator, can reply."
                  : "Take this conversation to put your name on it and reply."),
            chat.closed || chat.takenBy
              ? null
              : h("button", {
                  class: "btn btn-primary", style: "margin-top:10px",
                  disabled: st.busy === "take",
                  onclick: function () { takeConversation(chat.chatId); }
                }, st.busy === "take" ? "Taking…" : "Take this conversation"));

      return h("div", null,
        h("div", { class: "row", style: "gap:10px;margin-bottom:12px;align-items:center" },
          h("button", { class: "btn btn-sm", onclick: function () { backToConversations(); } }, "‹ Back"),
          statePill(chat.stateInWords, conversationTone(chat.state)),
          h("span", { class: "muted mono" }, "started " + fmtDate(chat.startedAt)),
          // THE WHOLE STORY, from the place where somebody is actually reading
          // one chapter of it. The shopper only ever sees the conversation they
          // are in, so this is the only way to find out what they were told last
          // week, and it is one tap from the reply box.
          chat.user
            ? h("button", {
                class: "btn btn-sm",
                style: "margin-left:auto",
                onclick: function () {
                  showEveryConversationFrom(chat.user.id, chat.user.displayId);
                }
              }, "Every conversation from " + chat.user.displayId)
            : null),
        st.actionError ? h("div", { class: "flash flash-err" }, st.actionError) : null,
        st.notice ? h("div", { class: "flash flash-info" }, st.notice) : null,
        warnings,
        h("div", null, bubbles),
        box,
        email);
    }

    function ChatQuestionsScreen() {
      var st = state.chat;
      var filters = h("div", { class: "row", style: "gap:8px;margin-bottom:14px" },
        [["UNRESOLVED", "Waiting"], ["ANSWERED", "Answered"], ["RESOLVED", "Closed"], ["", "All"]]
          .map(function (f) {
            return h("button", {
              class: "btn btn-sm" + (st.filter === f[0] ? " btn-primary" : ""),

          Stat(String(st.stats.saidItHelped), "said it helped", "ok"),

    function ChatQuestionCard(q) {

        h("div", { class: "row", style: "justify-content:space-between;gap:10px" },
          h("div", { style: "min-width:0" },
            h("div", { style: "font-weight:700;font-size:15px" }, q.rawText),

    function AnswerBookScreen() {
      var st = state.answers;

      var filters = h("div", { class: "row", style: "gap:8px;margin-bottom:14px" },

          .map(function (f) {

              onclick: function () { setAnswerFilter("status", f[0]); }
            }, f[1]);
          }));

      var body;
      if (st.loading && !st.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (st.error) body = h("div", { class: "flash flash-err" }, st.error);
      else if (!st.items || st.items.length === 0) body = h("div", { class: "empty" }, "No answers yet.");

    // WHAT TO WRITE NEXT.
    //
    // The questions people keep asking that nobody could answer, most asked
    // first. It is the honest way to decide what goes in the book next, instead
    // of guessing at what people want to know.
    //
    // TWO THINGS ARE SAID OUT LOUD, because a count on a screen is believed:
    // how many questions were looked at, and how two questions end up counted as
    // one. Every group also carries the real sentences somebody typed, so
    // anybody can see what was put together.
    function WhatToWriteNext(data) {
      if (!data) return null;
      if (!data.groups || data.groups.length === 0) {
        return h("div", { class: "card", style: "margin-bottom:14px" },
          h("div", { style: "font-weight:700" }, "Nothing waiting to be written"),
          h("div", { class: "muted", style: "font-size:12px;margin-top:4px" },
            "Out of the last " + String(data.readFrom)
            + " questions, every one was answered."));
      }
      return h("div", { class: "card", style: "margin-bottom:14px" },
        h("div", { style: "font-weight:700" }, "Write these next"),
        h("div", { class: "muted", style: "font-size:12px;margin-top:4px" },
          "Asked most often, out of the last " + String(data.readFrom)
          + " questions nobody could answer. Two questions count as one when they "
          + "use the same meaningful words, whatever order they are in."),
        h("div", { style: "margin-top:12px" }, data.groups.map(function (g) {
          return h("div", { class: "card", style: "margin-bottom:8px" },
            h("div", { class: "row", style: "justify-content:space-between;gap:10px" },
              h("div", { style: "font-weight:700;min-width:0" }, g.examples[0] || g.signature),
              statePill("asked " + String(g.asked), g.asked > 2 ? "bad" : "warn")),
            g.examples.length > 1
              ? h("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
                  "also asked as: " + g.examples.slice(1).join("  ·  "))
              : null,
            h("div", { class: "muted mono", style: "font-size:11px;margin-top:6px" },
              g.languages.join(", "),
              g.topics.length ? "  ·  " + g.topics.join(", ") : "",
              "  ·  last asked " + fmtDate(g.lastAskedAt)));
        })));
    }

    function AnswerCard(a) {
      var origin = answerOrigin(a);
      var note = approvalNote(a);
      var live = a.status === "PUBLISHED";
      return h("div", { class: "card finding" },
        h("div", { class: "row", style: "justify-content:space-between;gap:10px" },
          h("div", { style: "min-width:0" },
            h("div", { style: "font-weight:700;font-size:15px" }, a.title),
            h("div", { class: "muted mono", style: "margin-top:4px" },
              a.key, "  ·  ", a.languageName, "  ·  ", a.topic,
              "  ·  ", String(a.waysOfAsking), " ways of asking",
              "  ·  wording ", String(a.revision))),
          h("div", { class: "row", style: "gap:8px" },
            statePill(

              : "It is saved as a draft. Nobody sees it until you approve it."),
