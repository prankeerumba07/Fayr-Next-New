    // ── signing up: begin ─────────────────────────────────────────────────────
    //
    // HOW MANY PEOPLE REACH EACH STEP, AND WHERE THE REST STOP.
    //
    // Read-only, like "How Fayr is running" next to it. Nothing on this screen
    // has a form on it and nothing on it changes anything.
    //
    // ── THE ONE RULE THAT SHAPES EVERY NUMBER HERE ────────────────────────
    //
    // A percentage over nobody is a DASH, never a nought. "0% finished setup"
    // reads as a product that is failing; the truth in that case is that nobody
    // reached the step before it, which is a different fact and has to look
    // different. A percentage over a handful of people is shown but greyed, with
    // the count beside it, because "50% of people finish setup" is two people on
    // a quiet Tuesday and somebody will repeat it in a meeting as a finding.
    //
    // Both decisions are enforced in backend/src/events/funnel.ts and tested
    // there. This screen only has to draw what it is handed and never invent a
    // nought of its own.

    var GROWTH_WINDOWS = [7, 30, 90];

    async function loadGrowth() {
      state.growth.loading = true; state.growth.error = null; render();
      try {
        state.growth.data = await api("GET", "/admin/insights/funnel?days=" + state.growth.days);
      } catch (e) {
        state.growth.error = e.message;
      } finally {
        state.growth.loading = false; render();
      }
    }

    function setGrowthWindow(days) {
      state.growth.days = days;
      state.growth.data = null;
      loadGrowth();
    }

    /** A share, or a dash. Never a nought that was really a nothing. */
    function pct(v) { return v == null ? "—" : String(v) + "%"; }

    function GrowthScreen() {
      var st = state.growth;
      if (st.loading && !st.data) return h("div", { class: "muted" }, h("span", { class: "spin" }), " Reading…");
      if (st.error) return h("div", { class: "flash flash-err" }, st.error);
      if (!st.data) return h("div", { class: "empty" }, "Nothing yet.");
      var d = st.data;

      return h("div", null,
        GrowthWindowPicker(),
        GrowthHeadline(d),
        GrowthFunnel(d),
        GrowthSessions(d.sessions));
    }

    function GrowthWindowPicker() {
      return h("div", { class: "card", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
        h("span", { class: "muted" }, "Looking back"),
        GROWTH_WINDOWS.map(function (days) {
          return h("button", {
            class: "btn" + (state.growth.days === days ? " btn-primary" : ""),
            onClick: function () { setGrowthWindow(days); },
          }, days + " days");
        }));
    }

    // WHERE MOST PEOPLE STOP, AT THE TOP. It is the only question anybody opens
    // a funnel to answer, so it does not make them read a table to find it.
    function GrowthHeadline(d) {
      var delivery = d.codeDeliveryRate;
      // Below nine in ten is the line. A code that does not arrive is somebody
      // who wanted Fayr and could not get in, and no product work fixes it.
      var deliveryBad = delivery != null && delivery < 90;

      return h("div", { class: "card" },
        h("div", { style: "font-weight:700;font-size:15px" },
          d.worst
            ? "Most people stop at: " + d.worst.label
            : "Nobody dropped out in this window."),
        d.worst
          ? h("div", { class: "muted", style: "margin-top:6px" },
              String(d.worst.dropped) + " people did not get that far.")
          : null,
        h("div", {
          style: "margin-top:10px;font-weight:650;color:" + (deliveryBad ? "var(--bad)" : "var(--text)"),
        },
          "Codes asked for: " + String(d.codesRequested)
          + "  ·  entered correctly: " + String(d.codesVerified)
          + "  ·  " + pct(delivery)),
        deliveryBad
          ? h("div", { style: "margin-top:6px;color:var(--bad);font-size:13px" },
              "Under nine in ten. Codes that never arrive are people who wanted Fayr "
              + "and could not get in — check the SMS provider before anything else.")
          : h("div", { class: "muted", style: "margin-top:6px;font-size:13px" },
              "Counted per NUMBER, not per request: somebody who asks three times "
              + "because the first two never came is one person trying to get in."));
    }

    // ── THE FUNNEL AS A SHAPE ────────────────────────────────────────────────
    //
    // WHY A CHART HERE AND NOT ON A PERSON'S PAGE. This screen counts hundreds
    // of people, so a proportion drawn as a length is a real proportion. One
    // person's page has no distribution to draw and gets no chart at all.
    //
    // WHAT THE EYE IS MEANT TO DO. Land on the biggest gap. "Where do people
    // stop" is the only question anybody opens a funnel to answer, and the gap
    // between one bar and the one above it IS the number of people who did not
    // get from there to here. So the widest gap is the worst drop by
    // construction, and nothing has to be read to find it.
    //
    // IT INVENTS NOTHING. Every length is one count the server sent over another
    // count the server sent. No smoothing, no interpolation, no projected line,
    // and no step drawn at a length nobody measured.
    //
    // AND IT MEASURES ONCE. The table below carries the percentages, the drop
    // counts and the thin-base warning in words; the chart carries the shape and
    // repeats none of those numbers except each step's own count, which is what
    // labels the bar.

    /** The drawing, in viewBox units. One place, so no two of them can drift. */
    var FUNNEL_CHART = { w: 680, rowH: 30, barH: 14, padL: 196, padR: 58, padT: 10, padB: 8 };

    /**
     * WHAT EVERY BAR IS MEASURED AGAINST: the first step that has counted
     * anybody.
     *
     * Normally that is the first step of the journey, and the chart says so.
     *
     * IT IS NOT ALWAYS. The first three steps are reported by the app and read
     * nought until a release that sends them is out, and a share of nobody is
     * not a number — funnel.ts returns null for it rather than a nought, for the
     * same reason. Measuring everything against a nought would draw no chart at
     * all on the very data this screen exists to show. So the base falls through
     * to the first step that has a real count, and the chart NAMES the step it
     * is measuring against every time, because a bar whose denominator is a
     * surprise is worse than no bar.
     */
    function funnelBase(steps) {
      for (var i = 0; i < (steps || []).length; i++) {
        if (steps[i] && steps[i].count > 0) return steps[i];
      }
      return null;
    }

    /** This step's count over the base's. Null when there is nothing to divide by. */
    function funnelShare(count, base) {
      if (!base || !(base.count > 0)) return null;
      if (typeof count !== "number" || !isFinite(count)) return null;
      return count / base.count;
    }

    function GrowthFunnelChart(d) {
      var steps = (d && d.funnel) || [];
      var base = funnelBase(steps);
      if (!base) {
        return h("div", { class: "empty" },
          "Nothing has been counted at any step in this window, so there is no "
          + "shape to draw. The table below still shows every step.");
      }

      var g = FUNNEL_CHART;
      var innerW = g.w - g.padL - g.padR;
      var height = g.padT + steps.length * g.rowH + g.padB;
      // A step CAN be bigger than the base — a funnel counted over a fixed
      // window shows people finishing setup who started it last week, and
      // funnel.ts reports that rather than clamping it away. The drawn length
      // stops at the end of the track because there is nowhere else for it to
      // go; the count beside it is always the real one.
      var xOf = function (share) { return g.padL + Math.min(1, Math.max(0, share)) * innerW; };

      var els = [s("title", { text: "Each step of signing up, drawn against “" + base.label + "”" })];
      var previous = null; // the step above, only when it drew a bar of its own

      steps.forEach(function (step, i) {
        var top = g.padT + i * g.rowH;
        var y = top + (g.rowH - g.barH) / 2;
        var textY = y + g.barH - 3;
        var share = funnelShare(step.count, base);
        var drawsBar = share != null && step.count > 0;
        var worst = !!(d.worst && d.worst.key === step.key);

        els.push(s("rect", {
          class: "ftrack", x: g.padL, y: y, width: innerW, height: g.barH, rx: 3,
          style: "fill:var(--surface-2)",
        }));

        // THE DROP, DRAWN AS THE GAP. From where this bar ends to where the one
        // above it ended — which is exactly the people who did not get here.
        //
        // Only between two bars that both exist. A gap drawn back to a step that
        // has counted nothing would draw an ABSENCE as a collapse, which is the
        // one misreading this chart is built to avoid. The table's "Stopped
        // here" column still names that number.
        if (drawsBar && previous !== null && step.dropped > 0) {
          var from = xOf(share), to = xOf(funnelShare(previous.count, base));
          if (to > from) {
            els.push(s("rect", {
              class: "fdrop" + (worst ? " worst" : ""),
              x: from, y: y, width: to - from, height: g.barH, rx: 3,
              style: "fill:var(--warn);fill-opacity:" + (worst ? ".55" : ".2"),
            }, s("title", {
              text: String(step.dropped) + " did not get from “" + previous.label
                + "” to “" + step.label + "”",
            })));
          }
        }

        if (drawsBar) {
          // A THIN BASE IS NOT DRAWN AS THOUGH IT WERE SOLID. Hardly anybody
          // reached the step above this one, so the share is arithmetic rather
          // than a finding: the bar is pale and dashed as well as muted, so it
          // reads as provisional to somebody who cannot tell two greys apart.
          els.push(s("rect", {
            class: "fbar" + (step.thin ? " thin" : ""),
            x: g.padL, y: y, width: Math.max(1, xOf(share) - g.padL), height: g.barH, rx: 3,
            style: step.thin
              ? "fill:var(--muted);fill-opacity:.3;stroke:var(--muted);stroke-dasharray:3 2"
              : "fill:var(--text)",
          }, s("title", {
            text: step.label + ": " + String(step.count) + " of " + String(base.count),
          })));
        } else {
          // NOUGHT AND NOT-MEASURED-YET ARE DIFFERENT FACTS. A bar of length
          // zero reads as a step people failed at; these steps are ones nothing
          // has counted. So no bar, and the row says which it is in words.
          els.push(s("text", {
            class: "fnone", x: g.padL + 8, y: textY, "font-size": "11",
            style: "fill:var(--muted)",
          }, "nothing counted at this step"));
        }

        els.push(s("text", {
          class: "flabel", x: g.padL - 10, y: textY, "text-anchor": "end",
          "font-size": "11.5", style: "fill:var(--text)",
        }, step.label));
        // THE COUNT, BESIDE EVERY BAR AND NEVER IN A LEGEND — including the thin
        // ones and the ones with no bar at all, because the count is the fact
        // and the bar is only how it is drawn.
        els.push(s("text", {
          class: "fcount", x: g.w - 6, y: textY, "text-anchor": "end",
          "font-size": "11.5", style: "fill:var(" + (step.thin ? "--muted" : "--text") + ")",
        }, String(step.count)));

        previous = drawsBar ? step : null;
      });

      var measuredAgainst = steps[0] && base.key === steps[0].key
        ? "Every bar is that step’s count against “" + base.label + "”, the step "
          + "all the others are drawn from."
        : "Measured against “" + base.label + "” — nothing has been counted at "
          + "the steps above it, so there is no number there to measure against.";

      return h("div", null,
        s("svg", {
          viewBox: "0 0 " + g.w + " " + height, width: "100%", height: String(height),
          role: "img", style: "display:block;max-width:100%;height:auto",
        }, els),
        h("div", { class: "muted", style: "font-size:12.5px;margin-top:8px" },
          measuredAgainst
          + " The pale block after a bar is the people who did not get there from "
          + "the step above; the solid one is the drop named at the top of the "
          + "screen. A dashed bar means hardly anybody reached the step above it, "
          + "so its share is arithmetic rather than a finding."));
    }

    function GrowthFunnel(d) {
      var head = h("thead", null, h("tr", null,
        h("th", null, "Step"),
        h("th", { class: "num" }, "People"),
        h("th", { class: "num" }, "Of the step before"),
        h("th", { class: "num" }, "Of everyone who opened"),
        h("th", { class: "num" }, "Stopped here")));

      var rows = d.funnel.map(function (step) {
        var thin = step.thin && step.ofPrevious != null;
        return h("tr", null,
          h("td", { style: "font-weight:650" }, step.label),
          h("td", { class: "num" }, String(step.count)),
          // Greyed when hardly anybody reached the step above it — the number is
          // still shown, because hiding it would be its own kind of lie.
          h("td", { class: "num", style: thin ? "color:var(--muted)" : "" },
            pct(step.ofPrevious),
            thin ? h("span", { class: "muted", style: "font-size:11.5px" }, " too few to mean much") : null),
          h("td", { class: "num", style: thin ? "color:var(--muted)" : "" }, pct(step.ofStart)),
          h("td", { class: "num", style: step.dropped > 0 ? "color:var(--warn)" : "" },
            step.dropped > 0 ? String(step.dropped) : "—"));
      });

      return h("div", { class: "card" },
        h("div", { style: "font-weight:700;margin-bottom:8px" }, "From opening the app to claiming a campaign"),
        h("div", { class: "muted", style: "margin-bottom:10px;font-size:13px" },
          "The first three steps are reported by the app itself and will read nought "
          + "until a release that sends them is out. Everything from the code onward "
          + "is read from records Fayr has kept since the beginning."),
        // THE SHAPE FIRST, THE NUMBERS UNDER IT. The chart is beside the table
        // rather than instead of it: every percentage, every drop count and the
        // thin-base warning are still written out below in words.
        GrowthFunnelChart(d),
        h("div", { style: "height:14px" }),
        h("table", { class: "table" }, head, h("tbody", null, rows)));
    }

    function GrowthSessions(sx) {
      var rows = [
        ["Sessions that ran out unused", String(sx.expiredUnused),
         "Nobody opened the app for " + String(sx.sessionDays) + " days, so the sign-in lapsed."],
        ["Of those, signed in again", String(sx.cameBack) + "  (" + pct(sx.cameBackRate) + ")",
         "Asked for a code AFTER theirs ran out — the act of being asked to sign in again and doing it."],
        ["Signed out on purpose", String(sx.signedOut),
         "Tapped sign out. A different thing from a session lapsing, and counted apart."],
      ].map(function (r) {
        return h("tr", null,
          h("td", { style: "min-width:240px" },
            h("div", { style: "font-weight:650" }, r[0]),
            h("div", { class: "muted", style: "font-size:12.5px;margin-top:3px" }, r[2])),
          h("td", { class: "num", style: "vertical-align:top;font-weight:650" }, r[1]));
      });

      return h("div", { class: "card" },
        h("div", { style: "font-weight:700;margin-bottom:8px" },
          "Sessions — a sign-in lasts " + String(sx.sessionDays) + " days of silence"),
        h("div", { class: "muted", style: "margin-bottom:10px;font-size:13px" },
          "Every time somebody opens the app the clock starts again, so this is "
          + String(sx.sessionDays) + " days of never opening it, not "
          + String(sx.sessionDays) + " days since signing in."),
        h("table", { class: "table" }, h("tbody", null, rows)));
    }
    // ── signing up: end ───────────────────────────────────────────────────────

    // ── how it is running: begin ──────────────────────────────────────────────
    // (the markers let panel.test.mjs lift these functions out and really draw
    //  them against realistic data. A parse check cannot catch a call to a helper
    //  that does not exist, and this page is the one directors read.)
    //
    // ── How Fayr is running ───────────────────────────────────────────────────
    //
    // ONE READ ON OPEN, NO FORM, AND NOTHING ON IT CHANGES ANYTHING.
    //
    // That is the whole difference from the Reports tab beside it. A report is a
    // thing you ask a question of, so it takes a range and a granularity. This is
    // the answer to "how do you know it is working", and a director does not fill
    // in a form to find out whether the product works.
    //
    // ── THIS SCREEN WRITES NO WORDS OF ITS OWN ───────────────────────────────
    //
    // Every sentence, heading and phrase comes down with the data, out of
    // backend/src/running/running.words.ts, where a check walks all of it through
    // the real plain-language rule. A sentence written here would reach a director
    // without anything having read it. The panel's own check enforces that.
    //
    // ── AND IT DOES NO ARITHMETIC ON MONEY ───────────────────────────────────
    //
    // Amounts arrive as whole paise in a string and are grouped into rupees by
    // splitting the string, never by dividing a Number. Four money defects so far
    // have come from a figure reached by a second route.
    async function loadRunning() {
      state.running.loading = true; state.running.error = null; render();
      try {
        state.running.data = await api("GET", "/admin/how-it-is-running");
      } catch (e) {
        state.running.error = e.message;
      } finally {
        state.running.loading = false; render();
      }
    }

    // Whole paise in a string to rupees, by cutting the string. Mirrors rupeesOf in
    // backend/src/common/rupees.ts, including hiding a nought fraction.
    function paiseToRupees(paise) {
      if (paise == null) return "—";
      var digits = String(paise);
      var negative = digits.charAt(0) === "-";
      if (negative) digits = digits.slice(1);
      if (!/^[0-9]+$/.test(digits)) return "—";
      while (digits.length < 3) digits = "0" + digits;
      var whole = digits.slice(0, -2), fraction = digits.slice(-2);
      var last3 = whole.slice(-3), rest = whole.slice(0, -3), groups = [];
      while (rest.length > 2) { groups.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
      if (rest.length) groups.unshift(rest);
      var grouped = groups.length ? groups.join(",") + "," + last3 : last3;
      var body = "₹" + grouped + (fraction === "00" ? "" : "." + fraction);
      return negative ? "-" + body : body;
    }

    // THE THREE ANSWERS, AND THEY NEVER LOOK THE SAME.
    //
    // A counted nought is a real nought and is shown as a number. The other two are
    // shown as the words the server sent, because a nought standing in for "we do
    // not look" is the one lie this page must never tell.
    function Reading(reading, says, tone) {
      if (!reading) return h("span", { class: "muted" }, "—");
      if (reading.kind === "counted") {
        return h("span", { class: "stat" + (tone ? " stat-" + tone : "") }, String(reading.count));
      }
      var words = reading.kind === "nothing-yet" ? says.nothingYet : says.notWatching;
      return h("span", { class: "muted", style: "font-size:13px" }, words);
    }

    function MoneyReading(amount, says, tone) {
      if (!amount) return h("span", { class: "muted" }, "—");
      if (amount.kind === "counted") {
        return h("span", { class: "stat" + (tone ? " stat-" + tone : "") }, paiseToRupees(amount.paise));
      }
      if (amount.kind === "cannot-be-known") {
        return h("span", { class: "muted", style: "font-size:13px" }, amount.why);
      }
      return h("span", { class: "muted", style: "font-size:13px" }, says.nothingYet);
    }

    // The drop, in its four shapes. Never a negative number and never a nought
    // standing in for "nobody knows".
    function Drop(drop, dropHeading) {
      if (!drop) return null;
      if (drop.kind === "dropped") {
        return h("div", { class: "muted", style: "font-size:12px;margin-top:2px" },
          dropHeading + ": " + String(drop.count));
      }
      if (drop.kind === "does-not-line-up") {
        return h("div", { class: "muted", style: "font-size:12px;margin-top:2px;color:var(--warn)" }, drop.why);
      }
      // All three of the other shapes carry their own sentence, written on our
      // side where the plain-language check reads it.
      return h("div", { class: "muted", style: "font-size:12px;margin-top:2px" }, drop.why);
    }

    function RunningScreen() {
      var st = state.running;
      if (st.loading && !st.data) return h("div", { class: "muted" }, h("span", { class: "spin" }), " Reading…");
      if (st.error) return h("div", { class: "flash flash-err" }, st.error);
      if (!st.data) return h("div", { class: "empty" }, "Nothing yet.");
      var d = st.data, says = d.says;

      return h("div", null,
        // THE MOMENT IT WAS READ, FIRST. A number with no time against it is a
        // number nobody can trust.

    // Dependency-free inline-SVG vertical bar chart (panel is CSP-tight → no CDN).
    function svgBarChart(bars, opts) {
      opts = opts || {};
      if (!bars.length) return h("div", { class: "empty" }, "No data in range.");
      var W = 680, H = opts.height || 168, padL = 40, padR = 8, padT = 12, padB = 32;
      var innerW = W - padL - padR, innerH = H - padT - padB;
      var max = Math.max.apply(null, bars.map(function (b) { return b.value; }).concat([1]));
      var n = bars.length, slot = innerW / n, bw = Math.max(2, Math.min(40, slot * 0.66));
      var color = opts.color || "var(--accent)";
      var every = Math.ceil(n / 12);
      var fmt = opts.money ? inrShort : function (v) { return String(v); };
      var els = [s("line", { x1: padL, y1: padT + innerH, x2: W - padR, y2: padT + innerH, stroke: "var(--border)" })];
      els.push(s("text", { x: 4, y: padT + 7, "font-size": "9", fill: "var(--muted)" }, fmt(max)));
      bars.forEach(function (b, i) {
        var bh = max > 0 ? (b.value / max) * innerH : 0;
        var x = padL + i * slot + (slot - bw) / 2, y = padT + innerH - bh;
        els.push(s("rect", { x: x, y: y, width: bw, height: Math.max(0, bh), rx: 2, fill: color },
          s("title", { text: (b.title || b.label) + ": " + fmt(b.value) })));

        if (i % every === 0) els.push(s("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", "font-size": "9", fill: "var(--muted)" }, b.label));
      });
      return s("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: String(H), style: "display:block;max-width:100%" }, els);
    }

        actions.push(h("button", { class: "btn btn-sm btn-danger", onclick: function () { reveal("Reason for rejection (the user sees this)", "e.g. payout name doesn’t match the account holder", "Reject & refund", true, "/reject", "reason"); } }, "Reject"));
      } else if (w.status === "APPROVED") {
        actions.push(h("button", { class: "btn btn-sm btn-primary", onclick: function () { reveal("Bank UTR / reference number", "e.g. 123456789012", "Mark paid", false, "/mark-paid", "utr"); } }, "Mark paid"));
        actions.push(h("button", { class: "btn btn-sm btn-danger", onclick: function () { reveal("Reason for rejection (the user sees this)", "why it’s being rejected", "Reject & refund", true, "/reject", "reason"); } }, "Reject"));
        actions.push(h("button", { class: "btn btn-sm", onclick: function () { reveal("Reason the payout failed", "e.g. bank returned the transfer", "Mark failed & refund", true, "/mark-failed", "reason"); } }, "Mark failed"));

      var pm = w.payoutMethod || {};

      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", null,
            h("div", { class: "row" },
              h("span", { style: "font-weight:800;font-size:18px" }, rupees(w.amountPaise)),
              h("span", { class: "muted", style: "font-size:12px" }, "cash-out requested"),
              pill(w.status, WD_PILL[w.status] || "neutral")),
            // ── WHERE THAT MONEY CAME FROM ─────────────────────────────────
            //
            // The amount above is a request to move money OUT OF A WALLET. It is
            // not a refund and it is not tied to any one order — a withdrawal row
            // has no link to a task or a campaign anywhere in the schema. Without
            // this line the figure sits on the card with nothing behind it, which
            // is how ₹100.00 beside a ₹938.00 order got read as that order's
            // refund. On the practice account it is ₹100.00 because the demo seed
            // asks for exactly the minimum a withdrawal may be.
            // TWO FIGURES ON TWO DIFFERENT BASES, and the wording has to say so.
            // The balance is what is LEFT NOW — a requested withdrawal has already
            // reserved its own money out of it — while the refunds figure is
            // everything that has ever come IN that way. So the refunds total can
            // legitimately be LARGER than the balance, and a sentence calling it
            // "of it" read as impossible on the first card anybody looked at.
            w.basis ? h("div", { class: "muted", style: "margin-top:3px;font-size:12.5px" },
              "Wallet holds ", h("span", { class: "num" }, rupees(w.basis.walletBalancePaise)),
              " now · ", h("span", { class: "num" }, rupees(w.basis.refundsPaise)),
              " has come in from ",

            h("div", { class: "muted mono", style: "margin-top:3px;font-size:12.5px" },
              (u.mobile || "—"), "  ·  ", (u.displayId || ""),
              u.id ? h("a", { style: "margin-left:8px", onclick: function () { loadUser(u.id, "withdrawals"); } }, "view activity →") : null)),
          h("div", { style: "text-align:right;white-space:nowrap" },
            h("div", { class: "muted", style: "font-size:11.5px" }, "Requested"),
            h("div", { style: "font-size:12.5px" }, fmtDate(w.requestedAt)))),
        h("div", { class: "row", style: "margin-top:12px;gap:18px;flex-wrap:wrap" },
          h("div", null, h("span", { class: "muted", style: "font-size:12px" }, "Pay to  "),
            pill(pm.type || "—", "info"), " ", h("span", { class: "mono" }, pm.label || "—")),
          w.utr ? h("div", null, h("span", { class: "muted", style: "font-size:12px" }, "UTR  "), h("span", { class: "mono" }, w.utr)) : null,
          w.failureReason ? h("div", { class: "muted", style: "font-size:12.5px" }, "Reason: " + w.failureReason) : null),
        actions.length ? h("div", { class: "row", style: "margin-top:12px;gap:8px;flex-wrap:wrap" }, actions) : null,
        panel);
    }

    // ── Verifications (OCR screenshot review) ──────────────────────────────────
    var FIELD_LABEL = { product: "Product", amount: "Amount", orderDate: "Order date", delivery: "Delivery", rating: "Rating" };
    function costUsd(micro) { return micro == null ? "—" : "$" + (micro / 1e6).toFixed(4); }

    async function loadVerifications() {
      var v = state.verifications;
      v.loading = true; v.error = null; render();

        var resp = await api("GET", "/admin/verifications");

        if (!res.ok) throw new Error("image " + res.status);

        if (v.imgUrl) URL.revokeObjectURL(v.imgUrl);

    // ── Unit counts ─────────────────────────────────────────────────────────
    // A refund is for ONE unit, so an amount with no unit count cannot be paid.
    // Almost no marketplace page states one, which means holds are the ordinary
    // case rather than the exception — and a hold nobody can see is the same dead
    // end as a hold nobody can clear. This is the queue that closes both.
    //
    // Everything a reviewer needs is on the card: what the order says, what the
    // reader saw, what it refused to assert, and what will actually be paid if
    // they enter a number. They should not have to open the marketplace order to
    // make an obvious call.
    // The nightly offer check. GET recomputes it live so the tab is never stale;
    // the recorded runs are what "new since last night" is measured against.
    async function loadOffers(rerun) {
      var o = state.offers;
      if (rerun) o.busy = true; else o.loading = true;
      o.error = null; render();
      try {
        o.data = rerun
          ? await api("POST", "/admin/campaign-health/run")
          : await api("GET", "/admin/campaign-health");
      } catch (e) { o.error = e.message; }
      o.loading = false; o.busy = false; render();
    }

    async function loadAmounts() {
      var a = state.amounts;
      a.loading = true; a.error = null; render();
      try {
        var resp = await api("GET", "/admin/tasks/awaiting-amount");
        a.items = (resp && resp.items) || [];
        a.total = resp && typeof resp.total === "number" ? resp.total : a.items.length;
      } catch (e) { a.error = e.message; }
      a.loading = false; render();
    }

    // Why a page said nothing, or what it said that we refused. Plain words: the
    // reviewer needs to know whether to trust the page or distrust the reader.
    var QTY_REASON_TEXT = {
      "not-stated": "The order page did not state a unit count at all. That is normal — most single-unit orders show no count.",
      "picker": "A quantity DROPDOWN was found instead of a stated count. Its first option is not what was bought, so it was refused.",
      "conflicting": "Two different counts were found in the same item row, so neither could be trusted.",
      "implausible": "A count was found but it could not be right.",
      "partial": "Some of the order records stated a count and some did not, so they could not be added up.",
      "no-item-container": "The item's own row could not be located on the page, so nothing could be read from it.",
      "multi-unit-amount-unclear": "A count above one WAS read. It is not used automatically because we cannot yet tell whether the price beside it is for one unit or for the whole line — that is the call you are making."
    };

    // Where a typed figure may have come from. Mirrors AMOUNT_EVIDENCE_SOURCES in
    // backend/src/tasks/engine/evidence.types.ts. Every option names a place
    // somebody else can go and look — which is the whole point of it being a list
    // rather than free text: "they typed 499" is not a defence if the payout is
    // ever disputed.
    var AMOUNT_SOURCES = [
      ["order-page", "The marketplace order page"],
      ["invoice", "The marketplace invoice"],
      ["marketplace-email", "The order confirmation email"],
      ["bank-or-upi-statement", "The user's bank or UPI record"],
      ["user-screenshot", "A screenshot the user sent"]
    ];

    // The AMOUNT control. Deliberately tighter than the count: this is the only
    // money figure in the system a person invents rather than a machine reads, so
    // ₹499 becomes ₹4990 with one extra keystroke and the ledger pays it.
    //
    // Four things the count control does not have: a closed list of WHERE the
    // figure was read, the campaign's own price shown beside the field, a
    // disagreement that has to be ticked before it can be saved, and a ceiling
    // derived from something real. All four are enforced by the server too — this
    // is the version a person can see.
    function AmountFigureCard(it) {
      var a = state.amounts;

      var amountIn = h("input", {
        type: "text", inputmode: "decimal", placeholder: "0.00",
        style: "width:120px", "aria-label": "What one unit cost, in rupees"
      });
      var sourceSel = h("select", null,
        [h("option", { value: "" }, "Where did you read it?")].concat(
          AMOUNT_SOURCES.map(function (o) { return h("option", { value: o[0] }, o[1]); })));
      var reasonIn = h("input", {
        type: "text", maxlength: "500",
        placeholder: "What does it say? e.g. line reads ₹499 for this item",
        "aria-label": "What you saw"
      });
      var ackWrap = h("div", { style: "display:none;margin-top:8px" });
      var ackBox = h("input", { type: "checkbox" });
      var ackText = h("span");
      ackWrap.appendChild(h("label", { class: "row", style: "gap:8px;align-items:flex-start;font-size:12.5px" },
        ackBox, ackText));
      var previewLine = h("div", { class: "muted", style: "font-size:12.5px;margin-top:6px" });
      var msg = h("div");
      var btn = h("button", { class: "btn btn-sm btn-primary", type: "submit" }, "Confirm amount");

      // Rupees in the field, paise on the wire. The ledger is integer paise and
      // nothing rounds through a float on the way there.
      function paiseFromField() {
        var raw = String(amountIn.value || "").replace(/[₹,\s]/g, "");
        if (!/^\d+(\.\d{1,2})?$/.test(raw)) return null;
        var parts = raw.split(".");
        var paise = parts[1] ? (parts[1] + "0").slice(0, 2) : "00";
        return String(BigInt(parts[0]) * 100n + BigInt(paise));
      }

      var needsAck = false;
      function syncBtn() {
        var okAmount = paiseFromField() !== null;
        var okSource = sourceSel.value !== "";
        var okReason = reasonIn.value.trim().length >= 3;
        var okAck = !needsAck || ackBox.checked;
        btn.disabled = !(okAmount && okSource && okReason && okAck) || a.busy === it.taskId;
        btn.title = !okAmount ? "Enter the amount in rupees"
          : !okSource ? "Say where you read it"
          : !okReason ? "Say what you saw"
          : !okAck ? "Tick the box to save a figure that does not match the offer"
          : "";
      }
      sourceSel.onchange = syncBtn;
      reasonIn.oninput = syncBtn;
      ackBox.onchange = syncBtn;

      var timer = null, seq = 0;
      function refreshPreview() {
        var paise = paiseFromField();
        if (paise === null) {
          previewLine.textContent = "Enter the amount in rupees, e.g. 499 or 499.50.";
          needsAck = false; ackWrap.style.display = "none"; syncBtn();
          return;
        }
        previewLine.textContent = "Working out what this pays…";
        var mine = ++seq;
        // THE ONE ROUTE. The panel never multiplies an amount by a percentage
        // itself — the server runs the same resolver and the same payout function
        // the release uses, cap included.
        api("GET", "/admin/tasks/" + it.taskId + "/amount-preview?unitPricePaise=" + paise)
          .then(function (p) {
            if (mine !== seq) return;
            needsAck = p.disagreesWithCampaign === true;
            if (needsAck) {
              ackText.textContent = "This does not match what the offer says the product costs ("
                + rupees(p.campaignPricePaise) + "). That can be right — a discount is real — "
                + "but tick to confirm you meant it.";
              ackWrap.style.display = "";
            } else {
              ackBox.checked = false;
              ackWrap.style.display = "none";
            }
            if (p.payable) {
              previewLine.textContent = "This pays " + rupees(p.refundPaise)
                + " — " + it.payoutPercent + "% of " + rupees(p.chargedPaise)
                + (it.payoutCapPaise != null ? ", capped at " + rupees(it.payoutCapPaise) : "");
            } else {
              previewLine.textContent = "This still would not pay: " + p.heldExplanation;
            }
            syncBtn();
          })
          .catch(function (e) {
            if (mine !== seq) return;
            previewLine.textContent = "Could not work out what this pays: " + e.message;
            syncBtn();
          });
      }
      amountIn.oninput = function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(refreshPreview, 250);
      };
      refreshPreview();
      syncBtn();

      async function onSubmit(ev) {
        ev.preventDefault();
        msg.textContent = "";
        var paise = paiseFromField();
        if (paise === null) {
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, "Enter the amount in rupees, e.g. 499 or 499.50."));
          return;
        }
        a.busy = it.taskId; btn.disabled = true;
        try {
          await api("POST", "/admin/tasks/" + it.taskId + "/amount", {
            unitPricePaise: paise,
            evidenceSource: sourceSel.value,
            reason: reasonIn.value.trim(),
            acknowledgedDisagreement: ackBox.checked === true
          });
          a.busy = null;
          // The card is KEPT, marked as decided, so a reviewer who mistypes can
          // still fix it. It disappears on the next load of the queue.
          it.decidedAmountPaise = paise;
          a.total = Math.max(0, (a.total || 1) - 1);
          a.notice = "Saved " + rupees(paise) + " for one unit on task "
            + it.taskId.slice(0, 8) + ". If that was wrong, change it on the same card.";
          render();
        } catch (e) {
          a.busy = null;
          msg.textContent = "";
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message));
          syncBtn();
        }
      }

      if (it.decidedAmountPaise) {
        amountIn.value = (Number(it.decidedAmountPaise) / 100).toFixed(2);
        btn.textContent = "Save correction";
      }

      var ceiling = it.maxAmountPaise != null
        ? h("div", { class: "muted", style: "font-size:12px;margin-top:2px" },
            "Most this can be: " + rupees(it.maxAmountPaise) + " — "
            + (it.maxAmountAnchor === "order-total" ? "the order's own total" : "twice the offer price"))
        : h("div", { class: "flash flash-err", style: "font-size:12.5px;margin-top:8px" },
            "There is nothing to check a figure against here — this offer has no price and the order has no total. Set the offer price first.");

      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row", style: "gap:8px;align-items:center" },
              pill("held", "bad"),
              pill(it.platform, "info"),
              pill(it.state, "neutral"),
              it.decidedAmountPaise ? pill("just decided", "ok") : null),
            h("div", { style: "margin-top:6px;font-weight:600" }, it.campaignTitle || "—"),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, it.productName || "")),
          h("div", { style: "text-align:right" },
            h("button", {
              class: "btn btn-sm btn-ghost",
              onclick: function () { loadUser(it.user.id, "amounts"); }
            }, "Open user →"),
            h("div", { class: "muted mono", style: "margin-top:6px;font-size:11.5px" },
              "task " + it.taskId.slice(0, 8)))),
        h("div", { class: "flash flash-info", style: "margin-top:10px;font-size:13px" }, it.heldExplanation),
        h("div", { class: "row", style: "gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px" },
          factCell("Order", h("span", { class: "mono" }, it.orderId || "—")),
          factCell("Order total", rupees(it.orderTotalPaise)),
          factCell("The offer says", rupees(it.campaignPricePaise)),
          factCell("Ordered", fmtDay(it.orderDate)),
          // WHEN IT ARRIVED AND WHETHER IT WENT BACK. This is the row where a
          // person types a figure that becomes somebody's refund, and it showed
          // neither. A returned order is never paid, so it has to be visible
          // BEFORE the figure is typed rather than after the gate refuses it.
          factCell("Delivered", fmtDay(it.deliveredAt)),
          factCell("Sent back", sentBack(it.returned)),
          factCell("Stage", it.state)),
        h("form", { onsubmit: onSubmit, style: "margin-top:12px" },
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end" },
            h("label", { class: "field", style: "flex:0 0 auto" }, h("span", null, "What one unit cost (₹)"), amountIn),
            h("label", { class: "field", style: "flex:0 0 240px" }, h("span", null, "Where you read it — required"), sourceSel)),
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:2px" },
            h("label", { class: "field", style: "flex:1;min-width:240px" }, h("span", null, "What you saw — required"), reasonIn),
            btn),
          ceiling,
          ackWrap,
          previewLine,
          msg));
    }

    function AmountCard(it) {
      var a = state.amounts;
      var already = it.quantity != null;

      // Inputs live in this closure and are never re-rendered while being typed
      // in: the panel re-renders wholesale, which would drop focus and clear the
      // field mid-word. The preview line is updated by touching the node.
      var qtyIn = h("input", {
        type: "number", min: "1", max: "100", step: "1",
        value: already ? String(it.quantity) : "1",
        style: "width:88px", "aria-label": "How many units"
      });
      var reasonIn = h("input", {
        type: "text", maxlength: "500",
        placeholder: "What did you see? e.g. order page shows one unit",
        "aria-label": "Why this count"
      });
      var previewLine = h("div", { class: "muted", style: "font-size:12.5px;margin-top:6px" });
      var msg = h("div");
      var btn = h("button", { class: "btn btn-sm btn-primary", type: "submit" },
        already ? "Save correction" : "Confirm count");

      // The reason is REQUIRED and has no default. An audit row that says nothing
      // is worse than none, because it looks like diligence.
      function syncBtn() {
        var okReason = reasonIn.value.trim().length >= 3;
        btn.disabled = !okReason || a.busy === it.taskId;
        btn.title = okReason ? "" : "Say what you saw before saving";
      }
      reasonIn.oninput = syncBtn;

      var timer = null, seq = 0;
      function refreshPreview() {
        var q = parseInt(qtyIn.value, 10);
        if (!(q >= 1 && q <= 100)) {
          previewLine.textContent = "Enter a whole number of units, 1 to 100.";
          return;
        }
        previewLine.textContent = "Working out what this pays…";
        var mine = ++seq;
        // THE SAME ONE ROUTE as everything else. The panel deliberately does not
        // multiply the amount by the percentage itself: three money defects so far
        // have come from a second route to one number, and a preview that
        // disagreed with the action would be the fourth.
        api("GET", "/admin/tasks/" + it.taskId + "/quantity-preview?quantity=" + q)
          .then(function (p) {
            if (mine !== seq) return; // a later keystroke already won
            if (p.payable) {
              previewLine.textContent = "This pays " + rupees(p.refundPaise)
                + " — " + it.payoutPercent + "% of " + rupees(p.chargedPaise)
                + (it.payoutCapPaise != null ? ", capped at " + rupees(it.payoutCapPaise) : "");
            } else {
              previewLine.textContent = "This still would not pay: " + p.heldExplanation;
            }
          })
          .catch(function (e) {
            if (mine !== seq) return;
            previewLine.textContent = "Could not work out what this pays: " + e.message;
          });
      }
      qtyIn.oninput = function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(refreshPreview, 250);
      };
      refreshPreview();
      syncBtn();

      async function onSubmit(ev) {
        ev.preventDefault();
        var q = parseInt(qtyIn.value, 10);
        msg.textContent = "";
        if (!(q >= 1 && q <= 100)) {
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, "Enter a whole number of units, 1 to 100."));
          return;
        }
        if (reasonIn.value.trim().length < 3) {
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, "Say what you saw — this goes on the record for this payout."));
          return;
        }
        a.busy = it.taskId; a.actionError = null; btn.disabled = true;
        try {
          await api("POST", "/admin/tasks/" + it.taskId + "/quantity", {
            quantity: q, reason: reasonIn.value.trim()
          });
          a.busy = null;
          a.notice = "Saved. " + (already ? "Corrected to " : "Set to ") + q
            + (q === 1 ? " unit" : " units") + " on task " + it.taskId.slice(0, 8) + ".";
          await loadAmounts();
        } catch (e) {
          a.busy = null;
          msg.textContent = "";
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message));
          syncBtn();
        }
      }

      var facts = h("div", { class: "row", style: "gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px" },
        factCell("Order", h("span", { class: "mono" }, it.orderId || "—")),
        factCell("Amount on the line", rupees(it.itemPaise)),
        factCell("Order total", rupees(it.orderTotalPaise)),
        factCell("Ordered", fmtDay(it.orderDate)),
        factCell("Stage", it.state));

      var readerSaw = h("div", { style: "margin-top:10px" },
        h("div", { class: "nav-head", style: "padding:0 0 4px" }, "What the reader saw"),
        h("div", { style: "font-size:12.5px" },
          QTY_REASON_TEXT[it.quantityReason] || "No reading was recorded for this order."),
        it.quantityObserved != null
          ? h("div", { style: "font-size:12.5px;margin-top:4px" },
              h("strong", null, "The page stated " + it.quantityObserved
                + (it.quantityObserved === 1 ? " unit" : " units") + "."),
              " Check it before accepting it.")
          : null);

      var correction = already
        ? h("div", { class: "flash flash-err", style: "margin-top:10px;font-size:12.5px" },
            "A count of " + it.quantity + " is already on file. Saving a different number is a correction, and both numbers go on the record.")
        : null;

      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row", style: "gap:8px;align-items:center" },
              pill("held", "bad"),
              pill(it.platform, "info"),
              pill(it.state, "neutral")),
            h("div", { style: "margin-top:6px;font-weight:600" }, it.campaignTitle || "—"),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, it.productName || "")),
          h("div", { style: "text-align:right" },
            h("button", {
              class: "btn btn-sm btn-ghost",
              onclick: function () { loadUser(it.user.id, "amounts"); }
            }, "Open user →"),
            h("div", { class: "muted mono", style: "margin-top:6px;font-size:11.5px" },
              "task " + it.taskId.slice(0, 8)))),
        // The hold, in plain words, ABOVE the controls — so the reason to act and
        // the way to act are in one place.
        h("div", { class: "flash flash-info", style: "margin-top:10px;font-size:13px" }, it.heldExplanation),
        facts,
        readerSaw,
        correction,
        h("form", { onsubmit: onSubmit, style: "margin-top:12px" },
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end" },
            h("label", { class: "field", style: "flex:0 0 auto" }, h("span", null, "How many units"), qtyIn),
            h("label", { class: "field", style: "flex:1;min-width:220px" }, h("span", null, "Why — required"), reasonIn),
            btn),
          previewLine,
          msg));
    }

    // One labelled fact. Kept tiny and local so the card reads as a card.
    // WHETHER IT WENT BACK, IN WORDS, AND THE THREE ANSWERS ARE NOT TWO.
    //
    // null is "nothing we read said either way" and it is NOT "no". A dash for
    // both would tell a reviewer an order was fine when all we know is that we
    // never found out — and a returned order is never paid, so that is the one
    // place a silence must not read as an all-clear. The true case is loud on
    // purpose.
    function sentBack(value) {
      // Through pill(), which is the ONE place that knows how a pill is built.
      // This file has already been caught rendering a class name as text by
      // hand-building one, and the render check catches a MISSING helper rather
      // than a misused one.
      if (value === true) return pill("RETURNED", "bad");
      if (value === false) return "No";
      return h("span", { class: "muted" }, "Not known");
    }

    function factCell(label, value) {
      return h("div", null,
        h("div", { class: "nav-head", style: "padding:0 0 2px" }, label),
        h("div", null, value));
    }

    function AmountsScreen() {
      var a = state.amounts;
      var body;
      if (a.loading && !a.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (a.error) body = h("div", { class: "flash flash-err" }, a.error);
      else if (!a.items || a.items.length === 0) {
        body = h("div", { class: "empty" }, "No refunds are waiting on a unit count.");
      } else {
        body = h("div", null, a.items.map(function (it) {
          return it.action === "amount" ? AmountFigureCard(it) : AmountCard(it);
        }));
      }
      return h("div", null,
        a.notice ? h("div", { class: "flash flash-info", style: "margin-bottom:12px" }, a.notice) : null,
        a.actionError ? h("div", { class: "flash flash-err", style: "margin-bottom:12px" }, a.actionError) : null,
        h("div", { class: "muted", style: "font-size:12.5px;margin-bottom:12px" },
          "A refund is for one unit. When the order page does not say how many units were bought, "
          + "the refund is held rather than guessed — entering the count here releases it to the "
          + "normal checks. Nothing here pays money by itself."),
        body);
    }

    // ── Review checks ───────────────────────────────────────────────────────
    // Fayr pays for a review a shopper can READ. On most marketplaces a machine
    // settles that: Amazon publishes a review link that can be fetched, Flipkart
    // states its own moderation verdict. Meesho does neither — the star sits on
    // the order and the words stay inside its app — so there the question has no
    // machine answer, ever.
    //
    // The app has been telling those users "a Fayr reviewer confirms yours is
    // live" the whole time. This is the reviewer.
    // ── the assistant: loading and acting ────────────────────────────────────
    async function loadChats() {
      state.chats.loading = true; state.chats.error = null; render();
      try {
        // ONE PERSON'S WHOLE HISTORY, or the queue. A person's history comes
        // back newest first and includes the closed ones, which is what reading
        // somebody's story needs; the queue comes back longest wait first,
        // which is what picking up work needs.
        var q = state.chats.onlyUserId
          ? "?userId=" + encodeURIComponent(state.chats.onlyUserId)
          : (state.chats.filter ? "?state=" + state.chats.filter : "");
        var page = await api("GET", "/admin/chats" + q);
        state.chats.items = page.chats; state.chats.total = page.total;
      } catch (e) { state.chats.error = e.message; }
      state.chats.loading = false; render();
    }

    function setChatsFilter(st) {
      state.chats.filter = st; state.chats.onlyUserId = null; state.chats.person = null;
      state.chats.items = null; loadChats();
    }

    /** Every conversation this person has ever had, newest first. */
    function showEveryConversationFrom(userId, displayId) {
      state.chats.onlyUserId = userId;
      state.chats.person = displayId;
      state.chats.open = null;
      state.chats.items = null;
      loadChats();
    }

    async function openConversation(id) {
      state.chats.busy = id; state.chats.actionError = null; render();
      try {
        state.chats.open = await api("GET", "/admin/chats/" + id);
        state.chats.draft = ""; state.chats.warnings = []; state.chats.notice = null;
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    function backToConversations() {
      state.chats.open = null; state.chats.draft = ""; state.chats.warnings = [];
      state.chats.notice = null; state.chats.actionError = null;
      state.chats.items = null; loadChats();
    }

    async function takeConversation(id) {
      state.chats.busy = "take"; state.chats.actionError = null; render();
      try {
        state.chats.open = await api("POST", "/admin/chats/" + id + "/take");
        state.chats.notice = "Your name is on it. You are the only one who can reply.";
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    async function sendChatReply(id) {
      var words = (state.chats.draft || "").trim();
      if (!words) { state.chats.actionError = "There is nothing in that message."; render(); return; }
      state.chats.busy = "reply"; state.chats.actionError = null; render();
      try {
        var res = await api("POST", "/admin/chats/" + id + "/reply", { message: words });
        state.chats.open = res.chat;
        state.chats.draft = "";
        // Sent either way. The warning is about what was sent, not a refusal.
        state.chats.warnings = res.plainLanguage.ok ? [] : res.plainLanguage.problems;
        state.chats.notice = res.plainLanguage.ok
          ? "Sent. They will see it the next time their app looks."
          : null;
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    async function checkChatReply() {
      var words = (state.chats.draft || "").trim();
      state.chats.busy = "check"; state.chats.actionError = null; render();
      try {
        var res = await api("POST", "/admin/chats/reply/check", { message: words });
        state.chats.warnings = res.ok ? [] : res.problems;
        state.chats.notice = res.ok ? "That reads the way Fayr writes." : null;
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    async function saveReplyAsAnswer(chatId, messageId) {
      var topic = (state.chats.saveTopic || "").trim();
      if (!topic) {
        state.chats.actionError = "Say what kind of question this answers first. "
          + "An answer filed under the wrong kind is never found again.";
        render();
        return;
      }
      state.chats.savingFrom = messageId; state.chats.actionError = null; render();
      try {
        var res = await api(
          "POST",
          "/admin/chats/" + chatId + "/messages/" + messageId + "/save-as-answer",
          { topic: topic },
        );
        state.chats.saveTopic = "";
        state.chats.notice = "Saved as a draft answer called \u201C" + res.key
          + "\u201D. Somebody has to approve it in the Answer book before anybody "
          + "else is shown it."
          + (res.plainLanguage && !res.plainLanguage.ok
            ? " It will not be approvable until the wording is fixed."
            : "");
        // The suggestions list has changed shape now.
        state.answers.toWrite = null;
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.savingFrom = null; render();
    }

    async function loadWhatToWriteNext() {
      try {
        state.answers.toWrite = await api("GET", "/admin/chats/what-to-write-next");
      } catch (e) {
        // A list of suggestions failing must not take the answer book with it.
        state.answers.toWrite = null;
      }
      render();
    }

    async function loadEmailDraft(id) {
      state.chats.busy = "email"; state.chats.actionError = null;
      state.chats.emailNote = null; render();
      try {
        state.chats.email = await api("GET", "/admin/chats/" + id + "/email-draft");
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    async function copyEmailDraft() {
      var text = state.chats.email ? state.chats.email.body : "";
      if (!text) return;
      // Copying to the clipboard needs a secure address, and the panel is reached
      // from a phone on a plain one. So it tries, and SAYS SO when it cannot,
      // rather than looking as though it worked.
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          state.chats.emailNote = "Copied.";
        } else {
          state.chats.emailNote = "This browser will not let a page copy for you. "
            + "Select the text in the box and copy it yourself.";
        }
      } catch (e) {
        state.chats.emailNote = "That did not copy. Select the text in the box and "
          + "copy it yourself.";
      }
      render();
    }

    async function closeConversation(id) {
      state.chats.busy = "close"; state.chats.actionError = null; render();
      try {
        state.chats.open = await api("POST", "/admin/chats/" + id + "/close");
        state.chats.notice = "Closed. Nobody can add to it now.";
      } catch (e) { state.chats.actionError = e.message; }
      state.chats.busy = null; render();
    }

    async function loadChatQuestions() {
      state.chat.loading = true; state.chat.error = null; render();
      try {
        var q = state.chat.filter ? "?status=" + state.chat.filter : "";
        var page = await api("GET", "/admin/assistant/questions" + q);
        state.chat.items = page.questions; state.chat.total = page.total;
        state.chat.stats = await api("GET", "/admin/assistant/stats?days=30");
      } catch (e) { state.chat.error = e.message; }
      state.chat.loading = false; render();
    }

    function setChatFilter(status) {
      state.chat.filter = status; state.chat.items = null; loadChatQuestions();
    }

    async function closeChatQuestion(id) {
      state.chat.busy = id; state.chat.actionError = null; render();
      try {
        await api("POST", "/admin/assistant/questions/" + id + "/resolve");
        state.chat.notice = "Closed. It is out of the queue.";
        state.chat.items = null;
        await loadChatQuestions();
      } catch (e) { state.chat.actionError = e.message; }
      state.chat.busy = null; render();
    }

    async function loadAnswerBook() {
      state.answers.loading = true; state.answers.error = null; render();
      try {
        var qs = [];
        if (state.answers.filter.language) qs.push("language=" + state.answers.filter.language);
        if (state.answers.filter.status) qs.push("status=" + state.answers.filter.status);
        qs.push("limit=200");
        var page = await api("GET", "/admin/assistant/answers?" + qs.join("&"));
        state.answers.items = page.answers; state.answers.total = page.total;
      } catch (e) { state.answers.error = e.message; }
      state.answers.loading = false; render();
    }

    function setAnswerFilter(field, value) {
      state.answers.filter[field] = value;
      state.answers.items = null;
      loadAnswerBook();
    }

    /** Start writing. `from` is an existing answer to correct, or null for a new one. */
    function editAnswer(from) {
      state.answers.draft = from
        ? { id: from.id, key: from.key, language: from.language, title: from.title,
            body: from.body, topic: from.topic, phrases: "" }
        : { id: null, key: "", language: "en", title: "", body: "", topic: "refund", phrases: "" };
      state.answers.warnings = [];
      state.answers.actionError = null;
      render();
    }

    function cancelAnswerEdit() {
      state.answers.draft = null; state.answers.warnings = []; render();
    }

    /**
     * Ask the server what is wrong with the wording. The check lives on the server
     * so the warning here and the refusal at approve time can never disagree —
     * a second copy of the rule in this file would drift within a week.
     */
    async function checkAnswerWords() {
      var d = state.answers.draft;
      if (!d || !d.body) { state.answers.warnings = []; render(); return; }
      try {
        var out = await api("POST", "/admin/assistant/answers/check",
          { language: d.language, title: d.title || "", body: d.body });
        state.answers.warnings = out.problems || [];
      } catch (e) { state.answers.actionError = e.message; }
      render();
    }

    async function saveAnswer() {
      var d = state.answers.draft;
      if (!d) return;
      state.answers.busy = "save"; state.answers.actionError = null; render();
      try {
        var body = {
          key: d.key.trim(), language: d.language, title: d.title.trim(),
          body: d.body.trim(), topic: d.topic.trim()
        };
        var typed = (d.phrases || "").split("\n").map(function (x) { return x.trim(); })
          .filter(function (x) { return x.length > 0; });
        if (typed.length) body.phrases = typed;
        var out = await api("POST", "/admin/assistant/answers", body);
        state.answers.warnings = out.plainLanguage.problems || [];
        state.answers.notice = out.plainLanguage.ok
          ? "Saved."
          : "Saved, but it does not read plainly yet. It cannot be approved until it does.";
        state.answers.draft = null;
        state.answers.items = null;
        await loadAnswerBook();
      } catch (e) { state.answers.actionError = e.message; }
      state.answers.busy = null; render();
    }

    async function setAnswerLive(id, action) {
      state.answers.busy = id; state.answers.actionError = null; state.answers.notice = null; render();
      try {
        await api("POST", "/admin/assistant/answers/" + id + "/" + action);
        state.answers.notice = action === "approve"
          ? "Approved. The assistant can give this answer from now on."
          : "Withdrawn. The assistant will stop giving it.";
        state.answers.items = null;
        await loadAnswerBook();
      } catch (e) { state.answers.actionError = e.message; }
      state.answers.busy = null; render();
    }

    async function loadLivePages() {
      state.livepages.loading = true; state.livepages.error = null; render();
      try { state.livepages.data = await api("GET", "/admin/live-check"); }
      catch (e) { state.livepages.error = e.message; }
      state.livepages.loading = false; render();
    }

    async function loadReviewChecks() {
      var r = state.reviews;
      r.loading = true; r.error = null; render();
      try {
        var resp = await api("GET", "/admin/tasks/awaiting-review-check");
        r.items = (resp && resp.items) || [];
        r.total = resp && typeof resp.total === "number" ? resp.total : r.items.length;
      } catch (e) { r.error = e.message; }
      r.loading = false; render();
    }

    // The star the marketplace itself recorded. Shown as stars because that is
    // what the reviewer is about to go and look for on the page.
    function starsOf(rating) {
      if (rating == null) return "—";
      var n = Math.max(0, Math.min(5, Math.round(Number(rating))));
      if (!isFinite(n)) return "—";
      return "★".repeat(n) + "☆".repeat(5 - n) + "  " + n + " of 5";
    }

    function ReviewCheckCard(it) {
      var r = state.reviews;
      var done = it.confirmedVisible === true;

      // Inputs live in this closure, never re-rendered mid-word: the panel
      // re-renders wholesale and would drop focus.
      var urlIn = h("input", {
        type: "text", maxlength: "500",
        value: it.productUrl || "",
        placeholder: "https://…",
        "aria-label": "The page you opened"
      });
      var reasonIn = h("input", {
        type: "text", maxlength: "500",
        placeholder: "What did you see? e.g. this buyer's review is second from the top",
        "aria-label": "What you saw"
      });
      var msg = h("div");
      var yesBtn = h("button", { class: "btn btn-sm btn-primary", type: "submit" },
        done ? "Save correction" : "Yes — I can see it");
      // Only offered once a confirmation exists. It withdraws a Fayr reviewer's
      // own word and nothing else: a verdict a machine reached is refused by the
      // server, because that is a different decision.
      var noBtn = done
        ? h("button", { class: "btn btn-sm", type: "button" }, "It is not there — withdraw")
        : null;

      // Both fields are REQUIRED, in both directions. "I checked" with no address
      // is not evidence, and a record that says nothing looks like diligence.
      function syncBtns() {
        var okUrl = /^https?:\/\/\S{4,}$/i.test(String(urlIn.value || "").trim());
        var okReason = reasonIn.value.trim().length >= 3;
        var busy = r.busy === it.taskId;
        yesBtn.disabled = !(okUrl && okReason) || busy;
        yesBtn.title = !okUrl ? "Paste the address of the page you opened"
          : !okReason ? "Say what you saw"
          : "";
        if (noBtn) {
          noBtn.disabled = !(okUrl && okReason) || busy;
          noBtn.title = yesBtn.title;
        }
      }
      urlIn.oninput = syncBtns;
      reasonIn.oninput = syncBtns;
      syncBtns();

      async function decide(visible) {
        msg.textContent = "";
        r.busy = it.taskId; syncBtns();
        try {
          await api("POST", "/admin/tasks/" + it.taskId + "/review-visible", {
            visible: visible,
            productUrl: String(urlIn.value).trim(),
            reason: reasonIn.value.trim()
          });
          r.busy = null;
          r.notice = visible
            ? "Recorded: the review is live on task " + it.taskId.slice(0, 8)
              + ". The refund now waits on the normal checks — the return window has to pass first."
            : "Withdrawn on task " + it.taskId.slice(0, 8)
              + ". This refund cannot be paid while it stands withdrawn.";
          await loadReviewChecks();
        } catch (e) {
          r.busy = null;
          msg.textContent = "";
          msg.appendChild(h("div", { class: "flash flash-err", style: "margin-top:8px" }, e.message));
          syncBtns();
        }
      }
      if (noBtn) noBtn.onclick = function () { decide(false); };
      function onSubmit(ev) { ev.preventDefault(); decide(true); }

      // WHAT TO LOOK FOR. Without this the instruction is "find one review among
      // hundreds"; with it, it is a lookup. On Meesho these words are the only
      // clue there is, because nothing automatic can read the page.
      var lookFor = (it.reviewText || it.reviewTitle)
        ? h("div", { style: "margin-top:10px" },
            h("div", { class: "nav-head", style: "padding:0 0 4px" }, "What to look for on the page"),
            it.reviewTitle
              ? h("div", { style: "font-size:13px;font-weight:600" }, it.reviewTitle)
              : null,
            it.reviewText
              ? h("div", { style: "font-size:12.5px;white-space:pre-wrap" }, it.reviewText)
              : null,
            it.mediaCount
              ? h("div", { class: "muted", style: "font-size:12px;margin-top:3px" },
                  "The review carries " + it.mediaCount
                    + (it.mediaCount === 1 ? " photo" : " photos")
                    + " — that usually makes it easy to spot.")
              : null)
        : h("div", { class: "muted", style: "font-size:12.5px;margin-top:10px" },
            "We have no words from this review to give you — match it on the buyer's "
            + "name and the star rating instead.");

      var openLink = it.productUrl
        ? h("a", { href: it.productUrl, target: "_blank", rel: "noreferrer noopener" }, "Open the product page ↗")
        : h("span", { class: "muted" }, "This offer has no product page on file — ask the campaign owner for the link.");

      var confirmed = done
        ? h("div", { class: "flash flash-err", style: "margin-top:10px;font-size:12.5px" },
            "A Fayr reviewer has already confirmed this review is live"
            + (it.confirmedAt ? " on " + fmtDay(it.confirmedAt) : "")
            + (it.confirmedUrl ? ", on " + it.confirmedUrl : "")
            + ". Saving again is a correction, and both answers go on the record.")
        : null;

      // Stated on every card, not buried in a document: this is the one payout
      // signal in the system that nothing can ever re-check.
      var cannotRecheck = h("div", { class: "muted", style: "font-size:12px;margin-top:8px" },
        "Once this is confirmed, Fayr cannot check it again — there is no link to come back to. "
        + "If the review is taken down after the refund is paid, we will not know.");

      return h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:flex-start" },
          h("div", { style: "min-width:0" },
            h("div", { class: "row", style: "gap:8px;align-items:center" },
              done ? pill("confirmed", "ok") : pill("needs a look", "bad"),
              pill(it.platform, "info"),
              pill(it.state, "neutral")),
            h("div", { style: "margin-top:6px;font-weight:600" }, it.campaignTitle || "—"),
            h("div", { class: "muted", style: "margin-top:2px;font-size:12.5px" }, it.productName || "")),
          h("div", { style: "text-align:right" },
            h("button", {
              class: "btn btn-sm btn-ghost",
              onclick: function () { loadUser(it.user.id, "reviews"); }
            }, "Open user →"),
            h("div", { class: "muted mono", style: "margin-top:6px;font-size:11.5px" },
              "task " + it.taskId.slice(0, 8)))),
        // WHY this needs a person, above the controls — the reason to act and the
        // way to act in one place.
        h("div", { class: "flash flash-info", style: "margin-top:10px;font-size:13px" }, it.whyNoMachineCheck),
        h("div", { class: "row", style: "gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px" },
          factCell("They rated it", starsOf(it.rating)),
          factCell("Order", h("span", { class: "mono" }, it.orderId || "—")),
          factCell("Ordered", fmtDay(it.orderDate)),
          factCell("Stage", it.state)),
        lookFor,
        h("div", { style: "margin-top:10px;font-size:12.5px" }, openLink),
        confirmed,
        h("form", { onsubmit: onSubmit, style: "margin-top:12px" },
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end" },
            h("label", { class: "field", style: "flex:1;min-width:260px" },
              h("span", null, "The page you opened — required"), urlIn)),
          h("div", { class: "row", style: "gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:2px" },
            h("label", { class: "field", style: "flex:1;min-width:240px" },
              h("span", null, "What you saw — required"), reasonIn),
            yesBtn, noBtn),
          cannotRecheck,
          msg));
    }

    function ReviewChecksScreen() {
      var r = state.reviews;
      var body;
      if (r.loading && !r.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (r.error) body = h("div", { class: "flash flash-err" }, r.error);
      else if (!r.items || r.items.length === 0) {
        body = h("div", { class: "empty" }, "No reviews are waiting to be looked at.");
      } else {
        body = h("div", null, r.items.map(ReviewCheckCard));
      }
      return h("div", null,
        r.notice ? h("div", { class: "flash flash-info", style: "margin-bottom:12px" }, r.notice) : null,
        r.actionError ? h("div", { class: "flash flash-err", style: "margin-bottom:12px" }, r.actionError) : null,
        h("div", { class: "muted", style: "font-size:12.5px;margin-bottom:12px" },
          "Fayr pays for a review someone can read. On most marketplaces we can check that ourselves. "
          + "Where we cannot, the refund waits here until a person opens the page and says what is on it. "
          + "Nothing here pays money by itself — the return window still has to pass."),
        body);
    }

    function VerificationsScreen() {
      var v = state.verifications;
      if (v.selId && (v.detail || v.detailLoading || v.detailError)) return VerificationDetail();

      var body;
      if (v.loading && !v.items) body = h("div", { class: "muted" }, h("span", { class: "spin" }), " Loading…");
      else if (v.error) body = h("div", { class: "flash flash-err" }, v.error);
      else if (!v.items || v.items.length === 0) body = h("div", { class: "empty" }, "No screenshots waiting for review. 🎉");
      else {
        var items = v.items.slice().sort(function (a, b) {
