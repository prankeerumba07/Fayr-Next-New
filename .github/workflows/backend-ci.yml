name: backend-ci

# Runs the full quality gate on any change to the backend. A red check here
# means the change does not merge: lint → format → typecheck → unit → e2e → build.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel superseded runs on the same ref, so only the latest commit is verified.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Throwaway Postgres for this run only. Matches the local docker-compose so
    # e2e behaves identically to a developer's machine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fayr
          POSTGRES_PASSWORD: fayr
          POSTGRES_DB: fayr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fayr -d fayr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # CI-only secret — never a real one. Must satisfy the 32-char minimum.
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-value-32chars-min
      DATABASE_URL: postgresql://fayr:fayr@localhost:5432/fayr_test?schema=public
      TEST_DATABASE_URL: postgresql://fayr:fayr@localhost:5432/fayr_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` runs the postinstall hook (prisma generate), so the client is
      # ready for typecheck and tests.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # Guards the production Dockerfile — a broken image (e.g. a missing runtime
  # system lib) fails here instead of at deploy time.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t fayr-backend:ci ./backend
